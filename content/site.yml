# Einstellungen für die ganze Website. Alle Felder sind in ANLEITUNG.md erklärt.
# Texte dürfen *kursiv*, **fett** und [Links](https://example.org) enthalten.

# Name der ganzen Website (Fehlerseite). Die Übersichtsseiten tragen den Titel ihrer
# Tiergruppe (unten unter „animals“).
title: Naturführer

# Fußzeile jeder Seite (auf Regionsseiten steht davor „Stand: <updated>“)
footer: Texte, Zeichnungen und Karte mit KI (Claude) erstellt
# Link zum Repository in der Fußzeile (leer lassen oder entfernen, um ihn auszublenden)
repo_url: https://github.com/irrelevantat/birdwatching

# Hinweis zu den Schriften auf der Seite „Bilder & Quellen“ jeder Region
fonts_note: >-
  Schriften: Bricolage Grotesque (© The Bricolage Grotesque Project Authors) und Source
  Serif 4 (© The Source Serif 4 Project Authors), beide unter der [SIL Open Font License
  1.1](https://openfontlicense.org), als Teilmenge direkt von dieser Website geladen.

# Tiergruppen: Oben auf jeder Seite wählt man, welche Tiere man sehen will. Jede
# Tiergruppe hat eine eigene Übersichtsseite und eigene Regionsseiten; gemischt wird
# nicht. Hier stehen die Texte je Tiergruppe (alle Felder optional).
animals:
  voegel:
    # Startseite der Website
    title: Vogelführer
    eyebrow: Vögel beobachten
    lead: >-
      Regionale Führer zum Vogelbeobachten: typische Arten mit Bestimmungszeichnungen,
      die besten Orte und Tipps, wann und wie du sie findest.
    regions_title: Regionen
    description: >-
      Regionale Vogelführer mit Bestimmungszeichnungen, Karten, Beobachtungsorten und
      Tipps.
    drawings_note: >-
      Alle Vogelzeichnungen und die Karte wurden für diese Seite als Schemata neu
      gezeichnet, ohne ein einzelnes Foto oder eine fremde Illustration als Vorlage. Sie
      betonen die Bestimmungsmerkmale und sind untereinander nicht maßstabsgetreu. Texte,
      Zeichnungen und Karte wurden mit KI (Claude) erstellt.
  schmetterlinge:
    # Übersichtsseite unter /schmetterlinge/
    title: Schmetterlingsführer
    eyebrow: Schmetterlinge beobachten
    lead: >-
      Regionale Führer für Tag- und Nachtfalter: belegte Arten mit
      Bestimmungszeichnungen, die Orte mit den meisten Funden und Tipps, wann und wie du
      sie findest.
    regions_title: Regionen
    description: >-
      Regionale Schmetterlingsführer mit Bestimmungszeichnungen, Karten, Fundorten und
      Tipps.
    drawings_note: >-
      Alle Falterzeichnungen und die Karte wurden für diese Seite als Schemata neu
      gezeichnet: aus beschriebenen Merkmalen konstruiert, ohne ein einzelnes Foto oder
      eine fremde Illustration als Vorlage. Sie betonen die Bestimmungsmerkmale und sind
      untereinander nicht maßstabsgetreu. Texte, Zeichnungen und Karte wurden mit KI
      (Claude) erstellt.
