        - heraclides-thoas
        - caligo-telamonius
        - morpho-helenor
        - dryadula-phaetusa
        - dione-vanillae
        - hamadryas-guatemalena
        - callicore-pitheas
        - urania-fulgens

# Monate als Bereich „11-4“ (November bis April) oder als Liste [1, 2, 12].
season:
  title: Das Falterjahr
  rows:
    - label: Trockenzeit
      detail: November bis April
      months: 11-4
    - label: Regenzeit
      detail: Mai bis Oktober
      months: 5-10
    - label: Funde auf der Insel
      detail: aus jedem Monat, die meisten im Juli, Februar und Juni
      months: 1-12
    - label: Danaus eresimus
      detail: bisher nur Mai bis August gemeldet (8 Funde)
      months: 5-8
    - label: Eurytides epidaus
      detail: bisher nur April bis Juni gemeldet (4 Funde)
      months: 4-6
  note: >-
    Die Monate zeigen, wann Funde gemeldet wurden, also vor allem, wann Besucher
    fotografieren: Lücken heißen nicht, dass eine Art dann fehlt. In tropischen
    Trockenwäldern erreichen Artenzahl und Häufigkeit der Falter meist in der Regenzeit
    ihr Maximum (untersucht in Ecuador, nicht auf Ometepe). Am Maderas gipfelt die
    Trockenzeit im März und Anfang April. *Urania fulgens* ist ein Wanderfalter: Züge
    beginnen in Costa Rica und Panama im Juli oder Anfang August und können bis zu fünf
    Monate dauern.

tips:
  title: So siehst du mehr
  items:
    - title: Mittags und in der Dämmerung.
      text: >-
        Die meisten Tagfalter fliegen bei Wärme um die Mittagszeit. Große, dunkle Arten wie
        der Bananenfalter sind eher im Schatten und in der Dämmerung unterwegs,
        Morpho-Männchen patrouillieren morgens an Bachläufen. Die Schwarze Hexe fliegt
        nachts und ruht tagsüber an schattigen Stellen, etwa unter Dachvorsprüngen.
    - title: Fallobst absuchen.
      text: >-
        Dort saugen Malachitfalter, Bananenfalter, Morpho, Hamadryas und Colobura, nachts
        auch die Schwarze Hexe.
    - title: Blühende Sträucher im Blick behalten.
      text: >-
        Vor allem Lantana: Heraclides thoas, Dione vanillae, der Julia-Falter, Euptoieta
        hegesia und der Zebrafalter kommen dorthin.
    - title: Feuchte Stellen prüfen.
      text: >-
        An Wegen und Ufern saugen Männchen von Heraclides thoas und Callicore pitheas
        Mineralien.
    - title: Baumstämme mustern.
      text: >-
        Hamadryas sitzt kopfunter mit offenen Flügeln, Colobura kopfunter mit
        geschlossenen Flügeln in etwa 2 m Höhe. Hör auf das Knacken der
        Hamadryas-Männchen.
    - title: Passionsblumen merken.
      text: >-
        Sie sind Raupenfutter für fünf Arten dieses Führers (Dione vanillae, Dryadula
        phaetusa, Julia-Falter, Zebrafalter, Euptoieta hegesia). Wo sie ranken, kommen die
        Falter vorbei.
    - title: Langsam gehen, Abstand halten.
      text: >-
        Langsam und leise gehen und ein Fernglas oder Teleobjektiv nutzen, statt nah
        heranzutreten.
    - title: Funde melden.
      text: >-
        Ober- und Unterseite fotografieren und den Fund bei
        [iNaturalist](https://www.inaturalist.org) hochladen. 314 der 319 Belege hinter
        dieser Seite stammen von dort; jede Meldung verbessert die Insel-Liste.
    - title: Rücksicht.
      text: >-
        Nicht fangen und nicht anfassen, keine gezüchteten Falter freilassen, auf den
        Wegen bleiben und Raupen und Futterpflanzen lassen, wo sie sind. Raupen nicht
        berühren: Auf der Insel sind Arten belegt, deren Raupen Brennhaare oder
        Giftstacheln tragen, zum Beispiel Hylesia continua, Automeris io und Acharia.
    - title: Schutzgebiete und Guides.
      text: >-
        Ometepe ist seit 2010 UNESCO-Biosphärenreservat mit drei Schutzgebieten: Volcán
        Maderas, Volcán Concepción und Istián–Peña Inculta. Welche Regeln dort für das
        Sammeln von Insekten gelten, ist nicht geprüft; nimm nichts mit. Für die
        Vulkanwege sind lokale Guides üblich und vielerorts vorgeschrieben. Private Fincas
        und Unterkünfte nur mit Erlaubnis betreten.

