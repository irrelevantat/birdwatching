# Schmetterlinge auf Ometepe. Alle Felder sind in ANLEITUNG.md erklärt.
# Gleiche Region wie region.yml (Vögel); die Karte map.svg gilt für beide.
# Texte dürfen *kursiv*, **fett** und [Links](https://example.org) enthalten.
# Quelle: Inhaltspaket „Schmetterlinge auf Ometepe“, Stand 2026-11-19.

name: Ometepe
title: Schmetterlinge auf Ometepe
eyebrow: Isla de Ometepe · Nicaraguasee
summary: >-
  Malachitfalter, Morphos und Bananenfalter: {arten} auf der Insel belegte Arten mit
  Bestimmungszeichnungen, {orte} Gebiete mit vielen Funden und Tipps zur besten Zeit.
lead: >-
  Auf Ometepe fliegen Schmetterlinge das ganze Jahr. Dieser Führer zeigt {arten} Arten,
  die auf der Insel durch Fundmeldungen belegt sind, woran du sie erkennst und wo sie
  gemeldet wurden. Eine Schmetterlings-Checkliste für die Insel ließ sich nicht finden:
  Alle Angaben zum Vorkommen stützen sich auf 319 Fundpunkte bei GBIF.
updated: November 2026
order: 1
species_intro: >-
  Die Zeichnungen sind Schemata: Sie zeigen, worauf du achten musst, bei manchen Arten
  auch die Unterseite. Die Nummern im Bild gehören zur Liste darunter. „Funde“ zählt die
  Meldungen von der Insel bei GBIF, fast alle über iNaturalist.

