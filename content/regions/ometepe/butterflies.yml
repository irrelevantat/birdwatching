  caveats:
    - >-
        Dass eine Art in diesem Führer fehlt, heißt nicht, dass sie auf der Insel fehlt:
        319 Funde sind wenig.
    - >-
        Erenler, Gillman & Maes (2026) beschreiben 255 Arten aus dem pazifischen
        Trockenwald Nicaraguas. Die Arbeit wurde nicht ausgewertet; ihre Zusammenfassung
        nennt Ometepe nicht.
    - >-
        *Caligo telamonius*: „Mariposa búho“ ist ein Name für Caligo-Arten allgemein,
        belegt nur durch einen Zeitungsartikel (La Prensa, 12.1.2014), der nur als
        Suchtreffer gelesen werden konnte.
    - >-
        *Anartia fatima*: Vergleich mit Adelpha: eigene Kenntnis, nicht durch eine der
        genannten Quellen belegt.
    - >-
        *Heraclides thoas*: Merkmal 2 (Randflecken), der gelbe Fleck im Schwanz (Merkmal
        3) und Merkmal 4 (roter Fleck): eigene Kenntnis, nicht durch eine der genannten
        Quellen belegt. Die Quelle beschreibt nur die Diagonalbinde.
    - >-
        *Caligo telamonius*: Merkmale 1 und 2 (Farben der Oberseite): eigene Kenntnis,
        nicht durch eine der genannten Quellen belegt. Die Quellen beschreiben nur
        Größe, Auge und Lebensweise.
    - >-
        *Morpho helenor*: Spannweite: Die Quellen widersprechen sich stark, deshalb als
        Spanne angegeben.
    - >-
        *Euptoieta hegesia*: Merkmale 2 und 3 sowie der dunkle Saum (Merkmal 4): eigene
        Kenntnis, nicht durch eine der genannten Quellen belegt. Die Quelle beschreibt
        die ungezeichnete innere Flügelhälfte und den nicht gewinkelten
        Hinterflügelrand.
    - >-
        *Dione vanillae*: Merkmale 2 und 4: eigene Kenntnis, nicht durch eine der
        genannten Quellen belegt. Die Quelle nennt die drei weißen Punkte, schwarze
        Zeichnung auf Orange und die Silberflecken der Unterseite.
    - >-
        *Chlosyne lacinia*: Die Zeichnung zeigt eine Form mit breitem orangem Band;
        andere Formen haben ein schmales oder helles Band.
    - >-
        *Colobura dirce*: Merkmal 4 (Augenflecken am Schwänzchen): eigene Kenntnis,
        nicht durch eine der genannten Quellen belegt.
    - >-
        *Callicore pitheas*: Merkmale 2 und 4 sowie die Farben der Unterseite: eigene
        Kenntnis, nicht durch eine der genannten Quellen belegt. Online fanden sich nur
        Gattungsmerkmale und der englische Name („two-eyed“).
    - >-
        *Callicore pitheas*: Vergleich mit Heliconius erato: eigene Kenntnis, nicht
        durch eine der genannten Quellen belegt.
    - >-
        *Dryas iulia*: Der kurze schwarze Strich (Merkmal 4) und der Vergleich mit
        Marpesia petreus: eigene Kenntnis, nicht durch eine der genannten Quellen
        belegt.
    - >-
        *Eurytides epidaus*: Merkmale nur schwach belegt: Eine Blogquelle nennt weiße
        Flügel mit dünnen schwarzen Streifen, lange Schwänze und einen roten Streif auf
        der Hinterflügel-Unterseite. Die durchscheinenden Flügel (Merkmal 1) und der
        rote Fleck der Oberseite (Merkmal 4): eigene Kenntnis, nicht durch eine der
        genannten Quellen belegt.
    - >-
        *Eurytides epidaus*: Lebensraumgruppe nach den Fundorten auf Ometepe gewählt;
        eine Quellenangabe zum Lebensraum fehlt.
    - "*Eurytides epidaus*: Spannweite: widersprüchliche Angaben, deshalb als Spanne."
    - >-
        *Heliconius charithonia*: Merkmale 3 und 4 im Detail: eigene Kenntnis, nicht
        durch eine der genannten Quellen belegt. Die Quelle nennt lange, schmale
        schwarze Flügel mit schmalen gelben Streifen.
    - >-
        *Urania fulgens*: Nur 2 Funde auf Ometepe – aufgenommen als einer der zwei
        markanten Nachtfalter, nicht weil er häufig wäre.
    - >-
        *Urania fulgens*: Lebensraumgruppe redaktionell gewählt: Die Art wandert und
        kann überall im Flug auftauchen.
    - >-
        *Ascalapha odorata*: Der Augenfleck (Merkmal 4) ist in der Quelle ohne
        Flügelangabe beschrieben; die Lage am Hinterflügel: eigene Kenntnis, nicht durch
        eine der genannten Quellen belegt.
    - >-
        Charco Verde & Playa Venecia: 18 der 51 Funde liegen dicht beieinander (150 m um
        11,4801° N, 85,6346° W) – vermutlich im Eingangsbereich mit dem
        Schmetterlingshaus; die genaue Lage des Hauses ist nicht geprüft. Dass
        einzelne Meldungen Tiere aus der Zucht betreffen, lässt sich nicht ausschließen.
        Alle 18 Arten dieser Liste sind auch außerhalb von Charco Verde belegt.
    - >-
        Mérida & Finca Mystica: Finca Mystica ist nach den Ortsangaben der Funde ein
        Anwesen zwischen Mérida und San Ramón; ob Tagesgäste aufs Gelände dürfen, ist
        nicht geprüft.
    - >-
        Ojo de Agua, Tilgüe & Playa Santo Domingo: Die Zuordnung der Fundpunkte zu Ojo
        de Agua beruht auf Koordinaten, nicht auf Ortsangaben der Beobachter.
    - >-
        Dass die Raupen von Hylesia, Automeris und Acharia nesseln, ist eigene Kenntnis
        und nicht durch eine der Quellen belegt.
    - >-
        Die Lebensraumgruppen sind eine redaktionelle Einteilung nach den
        Lebensraumangaben der Quellen und den Fundorten.
    - >-
        Kein Foto stammt von Ometepe. Mehrere zeigen andere Unterarten, Tiere aus
        Schmetterlingsgärten oder ein Sammlungsexemplar (siehe Bildunterschriften). Für
        Hamadryas guatemalena und Callicore pitheas fand sich kein Foto mit geprüfter
        Lizenz.
    - >-
        Schutzstatus: Für keine Art wurde ein Schutzstatus in Nicaragua oder eine
        Einstufung der IUCN geprüft.
