  note: >-
    Eine Schmetterlings-Checkliste oder Studie für Ometepe wurde nicht gefunden.
    Vorkommen, Fundzahlen und Orte stützen sich auf 319 Fundpunkte bei GBIF (Abruf
    19.11.2026), 314 davon von iNaturalist. Die Bestimmungen stammen von der iNaturalist-Community („Research Grade“) und wurden nicht
    nachgeprüft; einige falsch zugeordnete Namen sind nach dem Originalnamen korrigiert.
    Fundpunkte zeigen, wo und wann Besucher fotografieren: 57 der 319 Funde stammen von
    einer einzigen Person bei El Madroñal, 19 tragen nur eine Sammelkoordinate für die
    Insel. Merkmale, Größen und Lebensweise stammen aus den genannten Artseiten;
    Ausnahmen stehen unter „Was nicht belegt ist“.
