groups:
  - id: offenland
    label: Offenland & Wegränder
  - id: garten-waldrand
    label: Gärten, Fincas & Waldränder
  - id: wald
    label: Wald & Bachtäler

# Arten in Anzeigereihenfolge (nach Zahl der Funde). „id“ = Ordnername unter
# content/butterflies/. Ohne months: Die Fundmonate zeigen nur, wann jemand
# fotografiert hat, nicht, wann die Art fehlt.
butterflies:
  - id: siproeta-stelenes
    group: garten-waldrand
    status: 28 Funde
    text: >-
      Die am häufigsten gemeldete Art der Insel: 28 Funde von 23 Beobachtern, 2007–2026,
      in allen sechs Gebieten dieser Liste. Am ehesten siehst du ihn an Waldwegen und
      unter Obstbäumen mit Fallobst – bei Santa Cruz/El Madroñal (5 Funde), in Balgüe
      (4), in Charco Verde, bei Ojo de Agua und am Weg zur Cascada San Ramón (je 3).
  - id: anartia-fatima
    group: offenland
    status: 26 Funde
    text: >-
      26 Funde von 19 Beobachtern, 2003–2026 – von Moyogalpa bis Balgüe. Du findest ihn
      an Straßenrändern, auf Weiden und in Gärten; die meisten Meldungen kommen aus
      Santa Cruz/El Madroñal (6) und Balgüe (4). Sieben Funde stammen aus dem Dezember,
      fünf aus dem Februar.
  - id: heraclides-thoas
    group: garten-waldrand
    status: 16 Funde
    text: >-
      16 Funde von 15 Beobachtern, 2007–2026 – der meistgemeldete Schwalbenschwanz der
      Insel. Fünf Funde stammen aus Charco Verde, drei von der Isthmus-Nordseite bei
      Tilgüe und Ojo de Agua. Achte auf blühende Sträucher am Wegrand und auf feuchte
      Stellen, an denen Männchen saugen.
  - id: caligo-telamonius
    group: wald
    local: Mariposa búho
    status: 15 Funde
    text: >-
      15 Funde von 13 Beobachtern, 2012–2025, über die ganze Insel verteilt: Altagracia,
      Tilgüe, Charco Verde, Santa Cruz, Balgüe, Mérida, San Ramón. Fünf Funde stammen
      aus dem Mai, vier aus dem November. Schau in der Dämmerung an Bananenstauden und
      an gärendem Fallobst.
  - id: morpho-helenor
    group: wald
    status: 10 Funde
    text: >-
      10 Funde von 9 Beobachtern, 2010–2026. Drei davon am Weg zur Cascada San Ramón,
      zwei in Charco Verde, je einer bei El Madroñal und Ojo de Agua. Stell dich
      vormittags an einen Bachlauf oder Waldweg und warte: Der Falter kommt den Weg
      entlanggeflogen.
  - id: euptoieta-hegesia
    group: offenland
    status: 9 Funde
    text: >-
      9 Funde von 8 Beobachtern, 2007–2026; sieben davon von Mai bis Juli. Verstreut
      über die Insel: Moyogalpa, Charco Verde, Santa Cruz, Mérida, San Ramón. Such auf
      sonnigen Weiden, Brachen und an Wegrändern.
  - id: danaus-eresimus
    group: offenland
    status: 8 Funde
    text: >-
      8 Funde von 7 Beobachtern, 2003–2025 – alle zwischen Mai und August, also in der
      Regenzeit. Je zwei in Charco Verde und bei El Madroñal. Such an blühenden
      Wegrändern und auf Weiden.
  - id: dryadula-phaetusa
    group: offenland
    status: 8 Funde
    text: >-
      8 Funde von 6 Beobachtern, 2005–2022: vier bei Santa Cruz/El Madroñal, zwei in
      Charco Verde, je einer bei Ojo de Agua und südlich von Altagracia. Achte auf
      offenes, grasiges Gelände, in dem Passionsblumen ranken.
  - id: dione-vanillae
    group: offenland
    status: 7 Funde
    text: >-
      7 Funde von 5 Beobachtern, 2007–2026; fünf davon im Juli und August. Drei bei
      Santa Cruz/El Madroñal, je einer bei Balgüe und an der Isthmus-Nordseite. Such in
      Gärten und an sonnigen Wegrändern.
  - id: chlosyne-lacinia
    group: offenland
    status: 6 Funde
    text: >-
      6 Funde von 4 Beobachtern, 2019–2025: drei bei El Madroñal (Juli und August 2019),
      je einer östlich von Balgüe, südlich von Mérida und an der Straße zwischen Santa
      Cruz und Mérida. Such an Wegrändern, Zäunen und auf Brachen mit Korbblütlern.
  - id: hamadryas-guatemalena
    group: garten-waldrand
    status: 6 Funde
    text: >-
      6 Funde von 6 Beobachtern, 2012–2025, in sechs verschiedenen Monaten: je zwei in
      Charco Verde und bei Santa Cruz/El Madroñal, je einer bei Mérida und bei Ojo de
      Agua. Such Baumstämme an Wegrändern und Bachläufen ab und horch auf das Knacken.
  - id: colobura-dirce
    group: wald
    status: 5 Funde
    text: >-
      5 Funde von 5 Beobachtern, 2018–2026 – vier im Februar, einer im November. Zwei
      bei Balgüe, je einer bei Santa Cruz, bei Altagracia und am Volcán Concepción. Such
      an Stämmen in schattigem Wald und in Obstgärten mit Fallobst.
  - id: callicore-pitheas
    group: wald
    status: 4 Funde
    text: >-
      4 Funde von 4 Beobachtern, 2019–2026: zwei an der Isthmus-Nordseite (bei Ojo de
      Agua und nordöstlich von Tilgüe), einer bei Finca Mystica südlich von Mérida,
      einer mit ungenauer Koordinate am Volcán Concepción. Achte auf feuchte Stellen an
      Wegen und Ufern.
  - id: dryas-iulia
    group: garten-waldrand
    status: 4 Funde
    text: >-
      4 Funde von 4 Beobachtern, 2019–2025: zwei in Charco Verde (zuletzt am 19.11.2025
      am „Piscacho Trail“), je einer bei El Madroñal und am Maderas-Hang südlich von
      Santa Cruz. Warte an einem blühenden Strauch am Waldrand – der Falter kommt auf
      seiner Runde wieder vorbei.
  - id: eurytides-epidaus
    group: garten-waldrand
    status: 4 Funde
    text: >-
      4 Funde von 4 Beobachtern, alle von April bis Juni: Moyogalpa (6.5.2025), Playa
      Venecia bei Charco Verde (27.6.2016), Volcán Maderas (23.6.2012) und einer ohne
      genauen Ort (15.4.2016). Halt in diesen Wochen an offenen Wegen und feuchten
      Stellen Ausschau.
  - id: heliconius-charithonia
    group: garten-waldrand
    status: 3 Funde
    text: >-
      3 Funde von 3 Beobachtern: zwei in Charco Verde (28.7.2007 und 7.1.2026), einer
      bei El Madroñal (28.4.2019). Such im Halbschatten am Waldrand, wo Passionsblumen
      ranken.
  - id: urania-fulgens
    group: offenland
    status: 2 Funde
    chips: [Nachtfalter, tagaktiv]
    text: >-
      Nur 2 Funde: am 1.7.2016 an der Isthmus-Nordseite bei Playa Santo Domingo und am
      4.1.2011 ohne genauen Ort. Rechne nicht fest mit der Art. In Wanderjahren ziehen
      die Falter ab Juli durch Costa Rica und Panama – dann lohnt der Blick nach oben
      auch auf Ometepe.
  - id: ascalapha-odorata
    group: garten-waldrand
    status: 3 Funde
    chips: [Nachtfalter]
    text: >-
      3 Funde von 3 Beobachtern: Finca Mystica bei Mérida (15.2.2026), zwischen Santa
      Cruz und Balgüe (15.12.2025) und einer ohne genauen Ort (22.4.2016). Schau morgens
      unter Dachvorsprünge und an schattige Wände deiner Unterkunft.

# Karte & Orte: die sechs Gebiete mit den meisten Funden. pin = Position auf map.svg.
places:
  title: Karte & Gebiete
  intro: >-
    Die sechs Gebiete mit den meisten Fundmeldungen. Viele Funde heißen vor allem, dass
    dort viele Leute mit Kamera unterwegs waren. Bei jedem Gebiet stehen die Arten dieses
    Führers, die dort gemeldet wurden.
  map_label: Schematische Karte der Insel Ometepe
  map_caption: Schematische Karte. Lage der Gebiete ungefähr, Höhenringe angedeutet.
  sites:
    - name: Charco Verde & Playa Venecia
      tagline: Lagune, Trockenwald und Schmetterlingshaus an der Südküste des Concepción
      text: >-
        20 ha großes Reservat mit tropischem Trockenwald an einer Lagune. Am Eingang
        steht ein Schmetterlingshaus („Butterfly Paradise“). Hier haben die meisten
        verschiedenen Leute Falter gemeldet. Das spricht dafür, dass du auch bei einem
        kurzen Besuch etwas siehst. Geh die Waldwege langsam ab und achte auf blühende
        Sträucher und Fallobst. Fünf der 16 Insel-Funde von Heraclides thoas stammen von
        hier, dazu zwei der drei Funde des Zebrafalters. Belegt: 51 Funde von 34 Arten,
        gemeldet von 22 Personen (2005–2026). 18 der 51 Funde liegen dicht beieinander
        (150 m um 11,4801° N, 85,6346° W) – vermutlich im Eingangsbereich mit dem
        Schmetterlingshaus; die genaue Lage des Hauses ist nicht geprüft. Dass
        einzelne Meldungen Tiere aus der Zucht betreffen, lässt sich nicht ausschließen.
        Alle 18 Arten dieser Liste sind auch außerhalb von Charco Verde belegt. Eintritt
        ins Schmetterlingshaus: 5 US$ laut einem Reisebericht von 2017; aktuell nicht
        geprüft.
      pin: [141.2, 168]
      butterflies:
        - siproeta-stelenes
        - anartia-fatima
        - heraclides-thoas
        - caligo-telamonius
        - morpho-helenor
        - euptoieta-hegesia
        - danaus-eresimus
        - dryadula-phaetusa
        - hamadryas-guatemalena
        - dryas-iulia
        - eurytides-epidaus
        - heliconius-charithonia
    - name: Santa Cruz & El Madroñal
      tagline: Dörfer, Gärten und Wegränder am Nordwestfuß des Maderas
      text: >-
        Dörfer, Gärten, Weiden und Wegränder am Fuß des Vulkans. Die meisten Funde der
        Insel. Aber 57 der 84 stammen von einer einzigen Person, die zwischen März 2019
        und November 2022 bei El Madroñal fotografiert hat (37 Arten). Das zeigt, was
        ein einziges Wegstück hergibt, wenn man oft hinschaut – ein besonderer Hotspot
        ist damit nicht bewiesen. Lauf die Straße und die Seitenwege am frühen Vormittag
        ab. Belegt sind hier unter anderem Dryadula phaetusa (4 der 8 Insel-Funde),
        Dione vanillae, Chlosyne lacinia und Opsiphanes cassiae. Belegt: 84 Funde von 50
        Arten, gemeldet von 15 Personen (2002–2026). Ohne die Funde dieser einen Person
        bleiben 27 Funde von 21 Arten und 14 Beobachtern.
      pin: [272, 168]
      butterflies:
        - siproeta-stelenes
        - anartia-fatima
        - heraclides-thoas
        - caligo-telamonius
        - morpho-helenor
        - euptoieta-hegesia
        - danaus-eresimus
        - dryadula-phaetusa
        - dione-vanillae
        - chlosyne-lacinia
        - hamadryas-guatemalena
        - colobura-dirce
        - dryas-iulia
        - heliconius-charithonia
    - name: Balgüe & Finca Magdalena
      tagline: Gärten der Kaffee-Kooperative am Nordfuß des Maderas
      text: >-
        Kaffee-Kooperative mit Gärten; hier beginnt der Hauptweg zum Krater des Maderas.
        Breit gestreute Meldungen: kein Beobachter hat hier mehr als 5 Funde
        beigetragen. Ein Besucherbericht (ohne Datum) nennt die Gärten der Finca
        ausdrücklich wegen der vielen Schmetterlinge. Such in den Gärten und am unteren
        Teil des Maderas-Wegs. Zwei der fünf Insel-Funde von Colobura dirce stammen von
        hier; an Stämmen und Fallobst lohnt der zweite Blick. Belegt: 36 Funde von 28
        Arten, gemeldet von 21 Personen (2002–2026).
      pin: [312, 176]
      butterflies:
        - siproeta-stelenes
        - anartia-fatima
        - caligo-telamonius
        - danaus-eresimus
        - dione-vanillae
        - chlosyne-lacinia
        - colobura-dirce
        - ascalapha-odorata
    - name: Mérida & Finca Mystica
      tagline: Uferstraße und Gärten am Westfuß des Maderas
      text: >-
        Dorf, Uferstraße und Unterkünfte mit Gärten. Sieben Funde tragen die Ortsangabe
        „Finca Mystica“ (13. und 15.2.2026). Arten aus allen drei Lebensraumgruppen auf
        engem Raum: Anartia fatima und Euptoieta hegesia (Offenland), Caligo und
        Callicore pitheas (Wald), dazu die Schwarze Hexe. Geh die Uferstraße ab und
        schau in den Gärten deiner Unterkunft nach Fallobst und nach Faltern an
        Hauswänden. Belegt: 32 Funde von 25 Arten, gemeldet von 14 Personen (2013–2026).
        Finca Mystica ist nach den Ortsangaben der Funde ein Anwesen zwischen Mérida und
        San Ramón; ob Tagesgäste aufs Gelände dürfen, ist nicht geprüft.
      pin: [251, 258]
      butterflies:
        - siproeta-stelenes
        - anartia-fatima
        - heraclides-thoas
        - caligo-telamonius
        - euptoieta-hegesia
        - chlosyne-lacinia
        - hamadryas-guatemalena
        - callicore-pitheas
        - ascalapha-odorata
    - name: San Ramón & Weg zur Cascada
      tagline: >-
        Vom offenen Feld in den Wald: Weg zum Wasserfall am Südwestfuß des Maderas
      text: >-
        3,7 km langer Weg von der Estación Biológica de Ometepe zur Cascada San Ramón:
        erst offene Felder, dann Wald. Drei der zehn Morpho-Funde der Insel stammen von
        diesem Weg. Ein Reisebericht nennt Schmetterlinge im Waldabschnitt. Bleib im
        Waldabschnitt stehen und beobachte den Weg vor dir: Morpho-Männchen
        patrouillieren morgens an Bachläufen. Belegt sind im Gebiet außerdem Siproeta
        stelenes (3 Funde) und Euptoieta hegesia (2). Belegt: 20 Funde von 14 Arten,
        gemeldet von 13 Personen (2007–2026). Für den Weg wird Eintritt erhoben; der
        aktuelle Betrag ist nicht geprüft.
      pin: [280, 274]
      butterflies:
        - siproeta-stelenes
        - caligo-telamonius
        - morpho-helenor
        - euptoieta-hegesia
    - name: Ojo de Agua, Tilgüe & Playa Santo Domingo
      tagline: Quellbecken im schattigen Wald auf der Isthmus-Nordseite
      text: >-
        Zwei Quellbecken im schattigen Wald, 2 km landeinwärts von Playa Santo Domingo.
        Schatten, Wasser und Waldrand auf kleinem Raum: Belegt sind hier Morpho helenor,
        Callicore pitheas, Caligo und der einzige genau verortete Fund von Urania
        fulgens. Schau an den feuchten Stellen rund um die Becken und am Zufahrtsweg.
        Drei der 16 Insel-Funde von Heraclides thoas liegen in diesem Gebiet. Belegt: 22
        Funde von 15 Arten, gemeldet von 14 Personen (2012–2026). Die Zuordnung der
        Fundpunkte zu Ojo de Agua beruht auf Koordinaten, nicht auf Ortsangaben der
        Beobachter.
      pin: [240, 124]
      butterflies:
