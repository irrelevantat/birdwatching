# Region Ometepe. Alle Felder sind in ANLEITUNG.md erklärt.
# Texte dürfen *kursiv*, **fett** und [Links](https://example.org) enthalten.

# Kurzname, erscheint z. B. als „Auf Ometepe“ über dem regionalen Text jeder Art
name: Ometepe
title: Vögel auf Ometepe
eyebrow: Isla de Ometepe · Nicaraguasee
# Kurzbeschreibung für die Übersichtsseite
summary: >-
  Zwei Vulkane, Trockenwald, Nebelwald und viele Kilometer Seeufer im Nicaraguasee:
  {arten} Arten mit Bestimmungszeichnungen, {orte} Beobachtungsorte und Tipps zur besten
  Zeit.
lead: >-
  Zwei Vulkane, Trockenwald, Nebelwald und viele Kilometer Seeufer auf 276 km²: Ometepe
  ist ein kompaktes Revier zum Vogelbeobachten. Dieser Führer zeigt {arten} Arten, die
  du mit guten Chancen siehst oder hörst, woran du sie erkennst und wo du suchen
  solltest.
updated: November 2026
# Reihenfolge auf der Startseite
order: 1

# Kennzahlen im Kopf der Seite (2 bis 4 Stück)
facts:
  - value: "148"
    label: Arten auf der Insel-Checkliste (2007)
  - value: 33–1.394 m
    label: Höhenstufen am Maderas
  - value: mind. 56
    label: Zugvogelarten aus Nordamerika
  - value: "2010"
    label: Biosphärenreservat seit

# Lebensraum-Filter über den Artkarten. Jede Art unten verweist mit „group“ auf eine id.
groups:
  - id: wald
    label: Trockenwald & Gärten
  - id: wasser
    label: Seeufer & Feuchtgebiete
  - id: himmel
    label: Am Himmel
  - id: nacht
    label: Nachts

# Arten dieser Region in Anzeigereihenfolge. „id“ = Ordnername unter content/birds/.
# status und chips erscheinen als Kärtchen, text als Absatz „Auf <name>“.
# months = Monate, in denen die Art hier ist (fehlt die Angabe: ganzjährig).
birds:
  - id: langschwanzhaeher
    group: wald
    local: Urraca
    status: ganzjährig
    text: >-
      Das Wahrzeichen der Insel und im Tiefland fast überall zu sehen: am Strand von
      Santo Domingo, in Charco Verde, auf dem Peña-Inculta-Pfad und an den unteren
      Hängen des Maderas.
  - id: gelbnackenamazone
    group: wald
    local: Lora nuca amarilla
    status: ganzjährig
    text: >-
      Ometepe trägt eine der größten verbliebenen Populationen der Art. Zählungen von
      2025 und 2026 nennen je nach Methode und Gebiet rund 1.700 bis 3.700 Tiere. Die
      besten Chancen hast du auf dem Isthmus, vor allem in Peña Inculta, bei
      Sonnenaufgang oder kurz vor Sonnenuntergang. Nester werden für den Heimtierhandel
      geplündert: Bitte kaufe keine Papageien und zahle nicht für Fotos mit zahmen
      Tieren.
  - id: elfenbeinsittich
    group: wald
    local: Perico frentinaranja
    status: ganzjährig
    text: >-
      In Trockenwald, Gärten und Obstbäumen. Bei den Papageienzählungen auf der Insel
      wurden auch große Schwärme des größeren, ganz grünen Mexikosittichs (Pacific
      Parakeet) erfasst. Der kleine Tovisittich (Orange-chinned Parakeet) hat einen
      kurzen, spitzen Schwanz.
  - id: brauenmotmot
    group: wald
    local: Guardabarranco
    status: ganzjährig
    chips:
      - Nationalvogel Nicaraguas
    text: >-
      Das Smithsonian führt den Nationalvogel als Bewohner Ometepes. In der vorläufigen
      Insel-Checkliste von 2007 fehlt er allerdings: Rechne also nicht fest mit ihm und
      melde eine Sichtung bei eBird. Suche an Wegböschungen, Waldrändern und in
      halboffenem Gelände.
  - id: schwarzkopftrogon
    group: wald
    local: Trogón cabecinegro
    status: ganzjährig
    text: >-
      Ein typischer Vogel des Trockenwalds am Fuß der Vulkane. Suche ihn in Waldstücken
      wie Peña Inculta oder Charco Verde und an den unteren Hängen des Maderas.
  - id: hoffmannspecht
    group: wald
    local: Carpintero nuquiamarillo
    status: ganzjährig
    text: >-
      In Gärten, an Unterkünften und in lichten Wäldern rund um beide Vulkane. Der
      Vulkan Maderas ist unter anderem für diese Art als Important Bird Area
      ausgewiesen.
  - id: zimtamazilie
    group: wald
    local: Colibrí canela
    status: ganzjährig
    text: >-
      Der Kolibri der trockenen Tieflagen und Gärten. Im Nebelwald des Maderas löst ihn
      die Purpurkehlnymphe (Purple-throated Mountain-gem) ab.
  - id: schwefelmaskentyrann
    group: wald
    local: Güis
    status: ganzjährig
    text: >-
      Häufig in Dörfern, Gärten und am Seeufer. Verwechslungsgefahr besteht mit dem
      kleineren Rotscheitel-Maskentyrann (Güis chico) und dem dickschnäbligen
      Starkschnabel-Maskentyrann (Güis picudo), die beide auf der Insel vorkommen.
  - id: riefenschnabelani
    group: wald
    local: Pijul
    status: ganzjährig
    text: Auf Weiden, an Zäunen und Straßenrändern, oft direkt neben der Fahrbahn.
  - id: dohlengrackel
    group: wald
    local: Zanate
    status: ganzjährig
    text: >-
      In jedem Dorf, am Hafen von Moyogalpa und an den Stränden: eine der am häufigsten
      gemeldeten Arten der Insel. Am Seeufer lebt auch die kleinere Nicaraguagrackel
      (Nicaraguan Grackle), die es fast nur an den beiden großen Seen Nicaraguas gibt.
  - id: trauertyrann
    group: wald
    local: Tirano tropical
    status: ganzjährig
    text: >-
      Auf Leitungen und Zäunen überall im offenen Tiefland. Vom Güis unterscheidet ihn
      der graue Kopf ohne weißen Überaugenstreif.
  - id: goldwaldsaenger
    group: wald
    local: Reinita amarilla
    status: Wintergast
    months: 9-4
    text: >-
      Der häufigste Wintergast der Insel, etwa von September bis April in Gärten, Hecken
      und Ufergehölz. Im November kaum zu verfehlen.
  - id: tovisittich
    group: wald
    local: Chocoyo barbinaranja
    status: ganzjährig
    text: >-
      In Gärten, Mangobäumen und an Waldrändern im ganzen Tiefland, auch mitten in den
      Dörfern.
  - id: akazienzaunkoenig
    group: wald
    local: Charralero fajeado
    status: ganzjährig
    text: >-
      Der Charaktervogel des Trockenwalds und einer der am häufigsten gemeldeten Vögel
      der Insel. Sein Gesang begleitet dich auf jedem Pfad, etwa in Peña Inculta und
      Charco Verde. Der Vulkan Maderas ist auch für ihn als Important Bird Area
      ausgewiesen.
  - id: rotschnabeltaube
    group: wald
    local: Paloma piquirroja
    status: ganzjährig
    text: >-
      Die große Taube der Insel: in Trockenwald, Pflanzungen und auf hohen Bäumen in den
      Dörfern, oft im Überflug.
  - id: inkataeubchen
    group: wald
    local: Tortolita colilarga
    status: ganzjährig
    text: In Dörfern, Gärten und auf Wegen im Tiefland, oft direkt vor deinen Füßen.
  - id: braunschopftyrann
    group: wald
    local: Güis crestipardo mayor
    status: ganzjährig
    text: >-
      Häufig im Trockenwald und in Gärten. Im Nordwinter kommt der sehr ähnliche
      Gelbbauch-Schopftyrann dazu, der kleinere Schwarzkappen-Schopftyrann lebt
      ganzjährig hier: Sicher trennst du die drei am Ruf.
  - id: weissfluegeltaube
    group: wald
    local: Tórtola aliblanca
    status: ganzjährig
    text: >-
      Häufig im trockenen Tiefland, auf Feldern und in Ortschaften. Im Nordwinter kommen
      Zugvögel aus dem Norden dazu.
  - id: blauringtaube
    group: wald
    local: Paloma coliblanca
    status: ganzjährig
    text: >-
      Am Boden von Trockenwald, Pflanzungen und schattigen Gärten, oft nur als Ruf aus
      dem Unterholz.
  - id: rotstirnamazone
    group: wald
    local: Loro frentirrojo
    status: ganzjährig
    text: >-
      An den bewaldeten Hängen und in großen Fruchtbäumen, vor allem auf der
      Maderas-Seite. Von der Gelbnackenamazone unterscheiden sie die rote Stirn und die
      gelbe Wange, ihr Nacken ist grün.
  - id: wegebussard
    group: wald
    local: Gavilán chapulinero
    status: ganzjährig
    text: >-
      Der häufigste kleine Greifvogel der Insel: an Straßen, Feldern und Waldrändern
      rund um beide Vulkane.
  - id: mexikosittich
    group: wald
    local: Perico gorgirrojo
    status: ganzjährig
    text: >-
      In großen Schwärmen über dem Tiefland und an den Vulkanhängen, vor allem morgens
      und abends. Größer und langschwänziger als der Elfenbeinsittich, ohne Orange an
      der Stirn.
  - id: starkschnabel-maskentyrann
    group: wald
    local: Güis picudo
    status: ganzjährig
    text: >-
      In Waldstücken und großen Bäumen, etwa in Charco Verde und an den Hängen des
      Maderas.
  - id: weissstirnamazone
    group: wald
    local: Loro frentiblanco
    status: ganzjährig
    text: >-
      In Trupps im Trockenwald und in Pflanzungen des Tieflands, oft gemeinsam mit
      Sittichen.
  - id: sperlingstaeubchen
    group: wald
    local: Tortolita común
    status: ganzjährig
    text: >-
      Auf Wegen, Feldern und sandigen Flächen im trockenen Tiefland. Das ähnliche
      Rosttäubchen (Ruddy Ground Dove) ist ungeschuppt, sein Männchen zimtrot mit grauem
      Kopf.
  - id: elfenwaldsaenger
    group: wald
    local: Parula tropical
    status: ganzjährig
    text: >-
      Im feuchten Wald und Nebelwald des Maderas, etwa am Weg ab Finca Magdalena. Im
      Nordwinter kann unten auch der ähnliche Meisenwaldsänger auftauchen (weißer
      Augenring, dunkles Brustband).
  - id: gelbkehlvireo
    group: wald
    local: Vireo pechiamarillo
    status: Wintergast
    months: 10-4
    text: >-
      Etwa von Oktober bis April im Trockenwald und in Schattenbäumen, zum Beispiel in
      Peña Inculta und Charco Verde.
  - id: baltimoretrupial
    group: wald
    local: Chichiltote norteño
    status: Wintergast
    months: 10-4
    text: >-
      Etwa von Oktober bis April in Gärten, Schattenbäumen und an Waldrändern. Achte auf
      blühende Bäume. Die heimischen Trupiale der Insel haben einen orangefarbenen Kopf
      mit schwarzem Kehllatz.
  - id: rotscheitel-maskentyrann
    group: wald
    local: Güis chico
    status: ganzjährig
    text: >-
      In Gärten, an Waldrändern und am Wasser. Kleiner als der Güis, mit deutlich
      kürzerem Schnabel.
  - id: scherenschwanz-koenigstyrann
    group: wald
    local: Tijereta rosada
    status: Wintergast
    months: 10-4
    text: >-
      Etwa von Oktober bis April auf Weiden und Feldern, vor allem auf dem flachen
      Isthmus und im Norden der Insel.
  - id: gilbdrossel
    group: wald
    local: Cenzontle
    status: ganzjährig
    text: >-
      In Gärten, Pflanzungen und an Waldrändern. Auf Ometepe wird sie deutlich seltener
      gemeldet als auf dem Festland.
  - id: bischofstangare
    group: wald
    local: Tángara azulada
    status: ganzjährig
    text: >-
      In Gärten, Obstbäumen und an Waldrändern, vor allem auf der feuchteren
      Maderas-Seite.
  - id: sommertangare
    group: wald
    local: Tángara veranera
    status: Wintergast
    months: 10-4
    text: >-
      Etwa von Oktober bis April einzeln in den Baumkronen von Trockenwald, Gärten und
      Pflanzungen.
  - id: rostbauchguan
    group: wald
    status: ganzjährig
    text: >-
      In den höheren Wäldern des Maderas. Am ehesten früh morgens am Aufstieg ab Finca
      Magdalena oder bei San Ramón zu hören.
  - id: mangrovekuckuck
    group: wald
    local: Cuclillo enmascarado
    status: ganzjährig
    text: >-
      Heimlich in Trockenwald und Ufergehölz, etwa in Charco Verde, wo er erstmals für
      die Insel gemeldet wurde. Leichter zu hören als zu sehen.
  - id: papstfink
    group: wald
    local: Azulito multicolor
    status: Wintergast, selten gemeldet
    months: 10-4
    text: >-
      Wintergast aus dem Süden der USA. Von der Insel gibt es bisher nur wenige
      Meldungen, darunter zwei aus dem Dezember bei El Madroñal; im November ist er also
      möglich, aber nicht sicher. Suche an verbuschten Feldrändern.
  - id: purpurkehlnymphe
    group: wald
    status: ganzjährig, nur Nebelwald
    text: >-
      Nur im Nebelwald im oberen Teil des Maderas; für sie musst du weit hinauf. Unten
      im Trockenwald ersetzt sie die Zimtbauchamazilie.
  - id: nordanden-olivtyrann
    group: wald
    status: ganzjährig, nur Nebelwald
    text: Im Nebelwald und an Lichtungen im oberen Teil des Maderas.
  - id: nacktkehlreiher
    group: wasser
    local: Garza tigre
    status: ganzjährig
    text: >-
      An ruhigen, bewachsenen Ufern: an der Lagune von Charco Verde und im Feuchtgebiet
      des Río Istián.
  - id: silberreiher
    group: wasser
    local: Garzón grande
    status: ganzjährig, im Nordwinter mehr
    text: >-
      Weiße Reiher stehen rund um die Insel am Ufer, besonders zahlreich im Feuchtgebiet
      des Río Istián.
  - id: rotbrustfischer
    group: wasser
    local: Martín pescador collarejo
    status: ganzjährig
    text: >-
      An Lagunen, Flussmündungen und am Seeufer. Vom Kajak aus im Río Istián kommst du
      ihm am nächsten.
  - id: gelbstirn-blatthuehnchen
    group: wasser
    local: Jacana
    status: ganzjährig
    text: Im Feuchtgebiet des Río Istián und an bewachsenen Lagunenufern.
  - id: herbstpfeifgans
    group: wasser
    local: Piche
    status: ganzjährig
    text: In Feuchtgebieten und an flachen, ruhigen Buchten des Sees.
  - id: gruenreiher
    group: wasser
    local: Garcilla capiverde
    status: ganzjährig, im Nordwinter mehr
    text: >-
      An bewachsenen Ufern rund um die Insel, an der Lagune von Charco Verde und am Río
      Istián. Klein und gut getarnt: Suche die Uferkante ab.
  - id: humboldtscharbe
    group: wasser
    local: Cormorán neotropical
    status: ganzjährig
    text: >-
      Auf Pfählen, Booten und Felsen rund um die Insel, in großer Zahl an
      Flussmündungen.
  - id: blaureiher
    group: wasser
    local: Garceta azul
    status: ganzjährig, im Nordwinter mehr
    text: >-
      An flachen Ufern rund um die Insel und im Feuchtgebiet des Río Istián, oft
      zwischen weißen Reihern.
  - id: drosseluferlaeufer
    group: wasser
    local: Andarríos maculado
    status: Wintergast
    months: 8-5
    text: >-
      Etwa von August bis Mai an fast jedem Ufer: an Stränden, Bootsanlegern und
      Flussmündungen. Der am häufigsten gemeldete Watvogel der Insel.
  - id: kanadareiher
    group: wasser
    local: Garzón azul
    status: Wintergast
    months: 10-4
    text: >-
      Etwa von Oktober bis April einzeln am Seeufer, an Lagunen und am Río Istián. Mit
      Abstand der größte Reiher der Insel.
  - id: mangroveschwalbe
    group: wasser
    local: Golondrina rabiblanca
    status: ganzjährig
    text: Über dem Seeufer, an Bootsstegen und an der Mündung des Río Istián.
  - id: dreifarbenreiher
    group: wasser
    local: Garceta tricolor
    status: ganzjährig, im Nordwinter mehr
    text: >-
      Im Flachwasser am Seeufer und am Río Istián. Der einzige dunkle Reiher der Insel
      mit weißem Bauch.
  - id: nachtreiher
    group: wasser
    status: ganzjährig
    text: >-
      In Bäumen an Lagunen und Flussarmen, etwa in Charco Verde und am Río Istián. Am
      besten in der Dämmerung.
  - id: rallenkranich
    group: wasser
    local: Cárao
    status: ganzjährig
    text: In den Sümpfen des Río Istián und an verkrauteten Lagunenufern.
  - id: zwergsultanshuhn
    group: wasser
    status: ganzjährig
    text: >-
      In den verkrauteten Wasserarmen des Río Istián und an Lagunen mit Schwimmpflanzen,
      oft neben dem Blatthühnchen.
  - id: drosselwaldsaenger
    group: wasser
    local: Reinita acuática norteña
    status: Wintergast
    months: 9-4
    text: >-
      Etwa von September bis April an schattigen Ufern, Bächen und Tümpeln, zum Beispiel
      an der Lagune von Charco Verde.
  - id: schneesichler
    group: wasser
    local: Ibis blanco
    status: ganzjährig
    text: In Trupps im Feuchtgebiet des Río Istián und an flachen, schlammigen Ufern.
  - id: amazonasfischer
    group: wasser
    status: ganzjährig
    text: >-
      An größeren, offenen Wasserflächen: am Seeufer, an Flussmündungen und am Río
      Istián. Deutlich größer als der Grünfischer, kleiner als der Rotbrustfischer.
  - id: moschusente
    group: wasser
    local: Pato real
    status: ganzjährig
    text: >-
      Wilde Moschusenten leben in den Sümpfen des Río Istián und an ruhigen Buchten.
      Schwarz-weiß gescheckte Tiere in den Dörfern sind Hausenten.
  - id: blaufluegelente
    group: wasser
    local: Cerceta aliazul
    status: Wintergast
    months: 10-4
    text: >-
      Etwa von Oktober bis April in flachen Lagunen und Feuchtgebieten wie am Río
      Istián.
  - id: schwarznacken-stelzenlaeufer
    group: wasser
    status: ganzjährig
    text: >-
      Im Flachwasser des Río Istián und an überschwemmten Wiesen und Lagunenrändern. Im
      November bisher selten gemeldet.
  - id: amerika-schlangenhalsvogel
    group: wasser
    local: Pato aguja
    status: ganzjährig
    text: >-
      An ruhigen Lagunen und Flussarmen, vor allem in Charco Verde und am Río Istián.
      Deutlich seltener als die Humboldtscharbe.
  - id: waldstorch
    group: wasser
    local: Cigüeña americana
    status: ganzjährig, umherstreifend
    text: >-
      Einzeln oder in kleinen Gruppen in flachen Feuchtgebieten wie am Río Istián, öfter
      hoch am Himmel kreisend. Im November bisher selten gemeldet.
  - id: gruenfischer
    group: wasser
    local: Martín pescador verde
    status: ganzjährig
    text: An schattigen Ufern, Bächen und Lagunen, in Charco Verde und am Río Istián.
  - id: schopfkarakara
    group: himmel
    local: Caracara crestado
    status: ganzjährig
    text: >-
      Über Weiden, Feldern und den Vulkanhängen, oft im Überflug. In älteren Büchern
      steht die Art als Caracara cheriway.
  - id: fischadler
    group: himmel
    local: Águila pescadora
    status: Wintergast
    months: 9-4
    text: >-
      Zugvogel aus Nordamerika, der vor allem in den Monaten des Nordwinters über dem
      See und seinen Buchten jagt.
  - id: rabengeier-truthahngeier
    group: himmel
    local: Zopilote negro, Zopilote cabecirrojo
    status: ganzjährig
    text: Täglich über Dörfern, Stränden und Vulkanhängen.
  - id: prachtfregattvogel
    group: himmel
    local: Rabihorcado magno
    status: Gast vom Pazifik, ganzjährig
    text: >-
      Meeresvogel, der vom Pazifik über die schmale Landenge von Rivas zum See fliegt.
      Über Ometepe kreisen regelmäßig einzelne Vögel oder kleine Gruppen, auch im
      November.
  - id: rauchschwalbe
    group: himmel
    local: Golondrina común
    status: Durchzügler und Wintergast
    months: 8-5
    text: >-
      Etwa von August bis Mai über Feldern, Stränden und dem See, im Herbst in großen
      Zugtrupps.
  - id: graubussard
    group: himmel
    local: Gavilán gris
    status: ganzjährig
    text: >-
      An Waldrändern und über dem Trockenwald beider Vulkane. Der Wegebussard hat
      dagegen ein helles Auge und einen rostbraun gebänderten Bauch.
  - id: fledermausfalke
    group: himmel
    local: Halcón murcielaguero
    status: ganzjährig, selten gemeldet
    text: >-
      Erstmals am Hotel Charco Verde für die Insel gemeldet und seither immer wieder
      beobachtet. Achte in der Dämmerung auf hohe, kahle Äste.
  - id: mangrovekreischeule
    group: nacht
    local: Cocoroca
    status: ganzjährig
    text: >-
      Im Trockenwald und in baumreichen Gärten. Auch für sie ist der Vulkan Maderas als
      Important Bird Area ausgewiesen. Frag deinen Guide nach bekannten Tageseinständen.
  - id: dominikanertriel
    group: nacht
    local: Alcaraván
    status: ganzjährig
    text: >-
      Auf Viehweiden und brachen Feldern, vor allem auf dem Isthmus und im flachen
      Norden. Tagsüber leicht zu übersehen, nachts gut zu hören. In älteren Büchern
      steht die Art als Burhinus bistriatus.
  - id: pauraquenachtschwalbe
    group: nacht
    local: Pocoyo
    status: ganzjährig
    text: >-
      Nachts auf unbefestigten Wegen und an Waldrändern überall im Tiefland. Fahre und
      gehe in der Dämmerung langsam: Die Vögel fliegen erst im letzten Moment auf.

# Karte & Orte. pin = Position der Nummer auf map.svg (x, y in Koordinaten der viewBox).
# Angrenzende Orte ergeben sich aus der Karte; mit near: [Name, …] lassen sie sich festlegen.
places:
  intro: >-
    Fünf Gebiete decken alle Lebensräume der Insel ab. Die Fähren vom Festland (San
    Jorge) legen in Moyogalpa an.
  map_label: Schematische Karte der Insel Ometepe
  map_caption: Schematische Karte. Lage der Orte ungefähr, Höhenringe angedeutet.
  sites:
    - name: Charco Verde
      tagline: Lagune und Trockenwald an der Südküste des Concepción
      text: >-
        Rundwege führen um eine grüne Lagune, durch Trockenwald und an einen Strand mit
        schwarzem Sand. An der Lagune stehen Wasservögel, im Wald leben Brüllaffen. Ein
        Biologe der School for Field Studies hat acht Arten erstmals für die Insel
        gemeldet, fast alle hier: mehrere Wasservögel, den Mangrovekuckuck und einen
        Fledermausfalken (Bat Falcon) am Hotel Charco Verde.
      pin: [141.2, 168]
      birds:
        - langschwanzhaeher
        - nacktkehlreiher
        - schwarzkopftrogon
        - hoffmannspecht
        - gruenreiher
        - nachtreiher
        - amerika-schlangenhalsvogel
        - akazienzaunkoenig
        - mangrovekuckuck
        - fledermausfalke
    - name: Peña Inculta
      tagline: Trockenwald auf Lavagestein bei Santo Domingo
      text: >-
        Der gut 1,5 km lange Pfad führt durch einen Trockenwaldrest auf Basaltblöcken.
        Er zählt zu den wichtigsten Schlaf-, Futter- und Brutplätzen der
        Gelbnackenamazone, und hier werden Zugvögel für ein Monitoring beringt. Komm zu
        Sonnenaufgang oder am späten Nachmittag, wenn die Papageien ein- und ausfliegen.
        Die Unión de Guías de Ometepe bietet Vogeltouren an.
      pin: [238.8, 124.8]
      birds:
        - gelbnackenamazone
        - elfenbeinsittich
        - langschwanzhaeher
        - schwarzkopftrogon
        - akazienzaunkoenig
        - gelbkehlvireo
    - name: Río Istián
      tagline: Feuchtgebiet auf dem Isthmus zwischen den Vulkanen
      text: >-
        Am besten mit dem Kajak ab Mérida: etwa eine Stunde über den See bis zur
        Flussmündung, hin und zurück rund drei Stunden. In den stillen, bewachsenen
        Wasserarmen stehen Reiher, Blatthühnchen und Stelzenläufer, darüber jagen
        Greifvögel. Zu Fuß ist das Gebiet kaum erschlossen. Starte früh, dann sind die
        Vögel aktiv.
      pin: [242, 169.6]
      birds:
        - silberreiher
        - nacktkehlreiher
        - gelbstirn-blatthuehnchen
        - rotbrustfischer
        - herbstpfeifgans
        - blaureiher
        - schneesichler
        - rallenkranich
        - zwergsultanshuhn
        - schwarznacken-stelzenlaeufer
        - mangroveschwalbe
    - name: Volcán Maderas
      tagline: Vom Trockenwald in den Nebelwald
      text: >-
        Zwischen dem Seeufer auf 33 m und dem Gipfel auf 1.394 m wechselt der Wald von
        Trockenwald über Übergangswald zu Nebelwald, und mit ihm die Vogelwelt: unten
        Trogone und Zaunkönige, oben Purpurkehlnymphe und Elfenwaldsänger. Der Vulkan
        ist als Important Bird Area ausgewiesen. Ein Aufstieg beginnt bei Balgüe an der
        Finca Magdalena. Der Weg ist steil und oft schlammig, ein Guide ist sinnvoll.
      pin: [301.2, 188.8]
      birds:
        - schwarzkopftrogon
        - hoffmannspecht
        - mangrovekreischeule
        - zimtamazilie
        - rostbauchguan
        - elfenwaldsaenger
        - purpurkehlnymphe
        - nordanden-olivtyrann
    - name: San Ramón
      tagline: Südwestflanke des Maderas
      text: >-
        Der Weg zum Wasserfall von San Ramón gilt als vogelreich. Genannt werden unter
        anderem Langschwanzhäher und Langschwanzpipra (Long-tailed Manakin). Für die
        biologische Station im Ort sind bei eBird 75 Arten gemeldet.
      pin: [275.6, 280]
      birds:
        - langschwanzhaeher
        - hoffmannspecht
        - schwefelmaskentyrann
        - rostbauchguan

# Monate als Bereich „11-4“ (November bis April) oder als Liste [1, 2, 12].
season:
  title: Das Vogeljahr
  rows:
    - label: Trockenzeit
      detail: November bis April
      months: 11-4
    - label: Regenzeit
      detail: Mai bis Oktober
      months: 5-10
    - label: Zugvögel aus Nordamerika
      detail: etwa November bis März
      months: 11-3
    - label: Amazonen am Nest (Isthmus)
      detail: Nestkontrollen November bis Januar
      months: 11-1
  note: >-
    In der Trockenzeit sind Wege und Sicht am besten, und die Wintergäste sind da. Die
    Regenzeit ist grüner und ruhiger, die Pfade am Maderas werden dann sehr schlammig.
tips:
  title: So siehst du mehr
  items:
    - title: Früh raus.
      text: >-
        Die erste Stunde nach Sonnenaufgang und die letzte vor Sonnenuntergang bringen
        die meisten Arten. Mittags ruht fast alles.
    - title: Erst hören, dann schauen.
      text: >-
        Papageien, Häher und Tyrannen verraten sich durch Rufe, lange bevor du sie
        siehst.
    - title: Ausrüstung.
      text: >-
        Fernglas (8×42 ist ein guter Kompromiss), gedeckte, leichte Kleidung, Wasser,
        Sonnenschutz und ein Bestimmungsbuch, etwa „Birds of Central America“ von
        Vallely und Dyer.
    - title: Mit Guide.
      text: >-
        Lokale Guides kennen Schlafbäume, Reviere und Tageseinstände von Eulen, und dein
        Geld bleibt auf der Insel.
    - title: Rücksicht.
      text: >-
        Halte Abstand zu Nestern und Schlafbäumen, spiele keine Rufe ab, blitze
        Nachtvögel nicht an und unterstütze keine Papageienhaltung.

