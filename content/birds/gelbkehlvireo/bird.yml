# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Gelbkehlvireo
english: Yellow-throated Vireo
scientific: Vireo flavifrons
length: 14
colors: [gelb, grün, weiß, grau]
marks:
  - Gelbe „Brille“ um das Auge
  - Leuchtend gelbe Kehle und Brust, weißer Bauch
  - Zwei weiße Flügelbinden
behavior: >-
  Bewegt sich bedächtig durch die Baumkronen und sucht Zweige nach Raupen ab, oft in
  gemischten Trupps mit Waldsängern.
