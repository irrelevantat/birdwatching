# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Sommertangare
english: Summer Tanager
scientific: Piranga rubra
length: 17
colors: [rot, gelb, orange]
marks:
  - Männchen ganz rosenrot, ohne Schwarz
  - Kräftiger heller Schnabel
  - Weibchen senfgelb bis orangegelb
behavior: >-
  Fängt Wespen und Bienen im Flug, schlägt sie an einem Ast tot und streift den Stachel
  ab. Frisst auch Früchte. Ruft kurz und abgehackt „pi-ti-tak“.
