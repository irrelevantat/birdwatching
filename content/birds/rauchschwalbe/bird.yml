# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Rauchschwalbe
english: Barn Swallow
scientific: Hirundo rustica
length: 18
colors: [schwarz, blau, rotbraun, weiß]
marks:
  - Rostrote Stirn und Kehle
  - Oberseite glänzend blauschwarz
  - Tief gegabelter Schwanz mit langen Spießen
behavior: >-
  Jagt in schnellem, wendigem Flug niedrig über Wiesen und Wasser und rastet in Reihen
  auf Leitungen. Dieselbe Art brütet in Europa in Ställen; hier überwintert die
  nordamerikanische Unterart.
