# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Rotbrustfischer
english: Ringed Kingfisher
scientific: Megaceryle torquata
size: ca. 40 cm
marks:
  - Zottige Haube und mächtiger Schnabel
  - Weißer Halsring
  - Rostrote Unterseite
  - "Zum Vergleich: Der Grünfischer (Green Kingfisher) ist nur halb so groß"
behavior: >-
  Der größte Eisvogel Amerikas. Sitzt auf Ästen und Leitungen über dem Wasser, fliegt
  oft hoch über den See und ruft dabei laut ratternd. Stößt kopfüber nach Fischen.
