# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Drosseluferläufer
english: Spotted Sandpiper
scientific: Actitis macularius
length: 19
colors: [braun, weiß]
marks:
  - Weißer Überaugenstreif
  - Weißer Keil zwischen Flügelbug und Brust
  - Wippt ständig mit dem Hinterkörper
  - Im Winter ungefleckt weiße Unterseite
behavior: >-
  Läuft einzeln an Uferkanten, Felsen und Stegen entlang und wippt dabei unentwegt.
  Fliegt flach über das Wasser, mit schwirrenden Flügelschlägen und kurzen Gleitphasen.
  Die namengebenden Flecken trägt er nur im Brutkleid.
