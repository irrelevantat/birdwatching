# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Nicaraguasittich
english: Pacific Parakeet
scientific: Psittacara strenuus
length: 32
colors: [grün]
marks:
  - Ganz grün, höchstens einzelne rote Federn an der Kehle
  - Kräftiger heller Schnabel, nackter heller Augenring
  - Langer, spitzer Schwanz
behavior: >-
  Fliegt in großen, lärmenden Schwärmen zwischen Schlaf- und Futterplätzen. Brütet in
  Felswänden, Erdhängen und Baumhöhlen.
