# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Herbstpfeifgans
english: Black-bellied Whistling-Duck
scientific: Dendrocygna autumnalis
length: 47-56
colors: [rotbraun, schwarz, grau, rot, weiß]
marks:
  - Korallenroter Schnabel, graues Gesicht
  - Schwarzer Bauch
  - Breiter weißer Flügelstreif
  - Lange rosa Beine, aufrechte Haltung
behavior: >-
  Ruht tagsüber in Gruppen am Ufer oder auf Bäumen und fliegt in der Dämmerung mit
  hohen, pfeifenden Rufen zu den Futterplätzen.
