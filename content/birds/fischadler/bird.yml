# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Fischadler
english: Osprey
scientific: Pandion haliaetus
size: Spannweite ca. 150–170 cm
length: 52-60
colors: [braun, weiß]
marks:
  - Lange, im Handgelenk geknickte Flügel mit dunklem Bugfleck
  - Unterseite weiß
  - Dunkler Streif durchs Auge
behavior: >-
  Rüttelt über dem Wasser, stürzt mit vorgestreckten Fängen hinein und trägt den Fisch
  mit dem Kopf voran davon.
