# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Mangrovekreischeule
english: Pacific Screech-Owl
scientific: Megascops cooperi
length: 23
colors: [grau, braun]
marks:
  - Kurze Federohren
  - Gelbe Augen im hellen Gesichtsschleier
  - Graubraunes, fein gestricheltes Gefieder als Rindentarnung
behavior: >-
  Nachtaktiv. Verrät sich nach Einbruch der Dunkelheit durch eine raue, tuckernde
  Rufreihe. Tagsüber döst sie dicht am Stamm.
