# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Schwefelmaskentyrann
english: Great Kiskadee
scientific: Pitangus sulphuratus
size: ca. 23 cm
marks:
  - Schwarz-weiß gestreifter Kopf
  - Schwefelgelbe Unterseite, weiße Kehle
  - Rotbraune Flügel und Schwanz
behavior: >-
  Sein lauter, dreisilbiger Ruf hat ihm den englischen Namen „Kiskadee“ und in Nicaragua
  den Namen „Güis“ eingebracht. Jagt von Warten aus Insekten, nimmt aber auch Früchte,
  Eidechsen und kleine Fische.
