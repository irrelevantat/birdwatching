# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Rotstirnamazone
english: Red-lored Amazon
scientific: Amazona autumnalis
length: 34
colors: [grün, rot, gelb, blau]
marks:
  - Rote Stirn
  - Gelbe Wange unter dem Auge
  - Scheitel bläulich überhaucht
  - Roter Flügelspiegel, im Flug gut zu sehen
behavior: >-
  Fliegt paarweise mit flachen, schnellen Flügelschlägen und ruft dabei laut. Frisst
  Früchte, Samen und Blüten in den Baumkronen.
