# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Gelbnackenamazone
english: Yellow-naped Amazon
scientific: Amazona auropalliata
length: 35-38
colors: [grün, gelb, rot]
iucn: CR
marks:
  - Gelber Fleck im Nacken, sonst kräftig grün
  - Roter Flügelspiegel, im Flug gut zu sehen
  - Kurzer, gerade abgeschnittener Schwanz, gedrungene Gestalt
behavior: >-
  Fliegt paarweise mit flachen, schnellen Flügelschlägen und tiefen, rollenden Rufen.
  Morgens und abends pendeln die Paare zwischen Schlafbäumen und Futterplätzen. Brütet
  in Baumhöhlen.
