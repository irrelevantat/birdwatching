# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Schwarzkopftrogon
english: Black-headed Trogon
scientific: Trogon melanocephalus
size: ca. 27 cm
marks:
  - Hellblauer Augenring im dunklen Kopf
  - Leuchtend gelber Bauch
  - Schwanzunterseite schwarz mit breiten weißen Feldern
behavior: >-
  Sitzt aufrecht und regungslos im mittleren Stockwerk des Waldes. Oft verrät ihn erst
  der Ruf, eine schneller werdende Reihe glucksender Töne. Brütet in
  Baumtermitennestern.
