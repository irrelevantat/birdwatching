# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Grünreiher
english: Green Heron
scientific: Butorides virescens
length: 44
colors: [rotbraun, grün, grau, gelb]
marks:
  - Schwarzgrüne Kappe
  - Kastanienbrauner Hals
  - Kurze gelbe bis orangefarbene Beine
behavior: >-
  Lauert geduckt und regungslos am Ufer oder auf Ästen dicht über dem Wasser. Streckt
  bei Störung den Hals und stellt die Haube auf. Legt manchmal Köder wie Insekten oder
  Krümel aus, um Fische anzulocken.
