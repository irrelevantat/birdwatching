# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Dominikanertriel
english: Double-striped Thick-knee
scientific: Hesperoburhinus bistriatus
length: 48
colors: [braun, weiß, gelb]
marks:
  - Großes gelbes Auge
  - Weißer Überaugenstreif mit schwarzem Rand darüber
  - Lange grünlich-gelbe Beine mit dicken Gelenken
behavior: >-
  Ruht tagsüber regungslos auf Weiden und Äckern und wird in der Dämmerung aktiv. Nachts
  schallen die lauten, gackernden Rufreihen weit über das Land.
