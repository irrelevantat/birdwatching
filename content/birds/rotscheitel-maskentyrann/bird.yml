# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Rotscheitel-Maskentyrann
english: Social Flycatcher
scientific: Myiozetetes similis
length: 17
colors: [gelb, schwarz, weiß, braun]
marks:
  - Kurzer, kleiner Schnabel
  - "Kopfzeichnung wie beim Güis: weißer Überaugenstreif, dunkle Maske"
  - Flügel und Schwanz olivbraun, ohne Rostrot
behavior: >-
  Lebt in lärmenden Familiengruppen, jagt Insekten von Warten aus und frisst viele
  Beeren. Ruft scharf „tschiir“.
