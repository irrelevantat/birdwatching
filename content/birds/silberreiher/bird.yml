# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Silberreiher
title: Silberreiher und zwei Doppelgänger
english: Great Egret
scientific: Ardea alba
size: 80–104 cm
# Für die Sortierung zählen auch die Doppelgänger auf dieser Karte: Kuhreiher ab 46 cm
length: 46-104
colors: [weiß, gelb]
marks:
  - "Silberreiher: groß, gelber Schnabel, schwarze Beine"
  - "Schmuckreiher (Snowy Egret): mittelgroß, schwarzer Schnabel, gelbe Zehen"
  - >-
    Kuhreiher (Cattle Egret): klein und gedrungen, kurzer gelber Schnabel, zur Brutzeit
    ockerfarben überhaucht
behavior: >-
  Der Silberreiher jagt meist einzeln und pirscht mit S-förmig gebogenem Hals durchs
  Flachwasser. Kuhreiher folgen Rindern und Pferden über die Weiden und schlafen
  gemeinsam in Bäumen am Wasser.
