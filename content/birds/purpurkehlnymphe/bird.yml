# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Purpurkehlnymphe
english: Purple-throated Mountain-gem
scientific: Lampornis calolaemus
length: 10.5
colors: [grün, weiß, rotbraun, blau]
marks:
  - Weißer Streif hinter dem Auge
  - Männchen mit violetter Kehle und türkisgrüner Stirn
  - Weibchen mit zimtfarbener Unterseite
behavior: >-
  Besucht Blüten im Unterwuchs und an Waldrändern des Nebelwalds, oft an Epiphyten.
  Männchen verteidigen ergiebige Blütenstände.
