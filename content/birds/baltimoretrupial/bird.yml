# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Baltimoretrupial
english: Baltimore Oriole
scientific: Icterus galbula
length: 19
colors: [orange, schwarz, weiß]
marks:
  - Kopf und Rücken des Männchens ganz schwarz
  - Unterseite leuchtend orange
  - Weiße Flügelbinde
behavior: >-
  Sucht in blühenden und fruchtenden Bäumen nach Nektar, Früchten und Insekten, oft
  zusammen mit anderen Wintergästen. Weibchen und Jungvögel sind matter gelborange und
  ohne schwarze Kapuze.
