# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Weißstirnamazone
english: White-fronted Amazon
scientific: Amazona albifrons
length: 25
colors: [grün, weiß, rot, blau]
marks:
  - Weiße Stirn, dahinter blauer Scheitel
  - Rot um das Auge
  - Männchen mit rotem Flügelrand
behavior: >-
  Die kleinste Amazone Mittelamerikas. Zieht in lärmenden Trupps zu Fruchtbäumen und
  Feldern und ruft kläffend „ack-ack-ack“.
