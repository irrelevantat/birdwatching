# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Dreifarbenreiher
english: Tricolored Heron
scientific: Egretta tricolor
length: 65
colors: [blau, grau, weiß]
marks:
  - Sehr langer, dünner Schnabel
  - Heller Streif an der Halsvorderseite
  - Weißer Bauch, scharf vom dunklen Gefieder abgesetzt
behavior: >-
  Jagt lebhafter als andere Reiher: rennt, dreht sich und breitet die Flügel aus, um
  kleine Fische aufzuscheuchen.
