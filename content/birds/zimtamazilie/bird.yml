name: Zimtamazilie
english: Cinnamon Hummingbird
scientific: Amazilia rutila
length: 10
colors: [grün, rotbraun, rot]
marks:
  - Roter Schnabel mit schwarzer Spitze
  - Ganze Unterseite zimtfarben
  - Rostroter Schwanz
behavior: >-
  Verteidigt blühende Sträucher energisch gegen andere Kolibris. An Hecken und
  Gartenblüten lässt sie sich deshalb gut beobachten.
