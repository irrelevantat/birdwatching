# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Nacktkehlreiher
english: Bare-throated Tiger-Heron
scientific: Tigrisoma mexicanum
length: 71-81
colors: [braun, grau, schwarz, gelb]
marks:
  - Nackte gelbe Kehle
  - Hals und Körper fein dunkel gebändert
  - Schwarze Kappe, graues Gesicht
behavior: >-
  Steht lange reglos am Ufer und stößt dann blitzschnell nach Fischen, Fröschen und
  Krebsen. In der Dämmerung ist sein tiefer, röhrender Ruf zu hören.
