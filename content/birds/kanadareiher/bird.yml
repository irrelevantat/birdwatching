# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Kanadareiher
english: Great Blue Heron
scientific: Ardea herodias
length: 91-137
colors: [grau, blau, weiß]
marks:
  - Weißes Gesicht, schwarzer Scheitelstreif mit Schopf
  - Mächtiger gelblicher Schnabel
  - Graublau, Hals graubraun mit schwarzer Strichelreihe
behavior: >-
  Steht einzeln und regungslos im Flachwasser und stößt blitzschnell nach großen
  Fischen. Fliegt mit langsamen Flügelschlägen und eingezogenem Hals.
