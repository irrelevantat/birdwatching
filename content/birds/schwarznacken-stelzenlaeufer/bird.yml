# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Schwarznacken-Stelzenläufer
english: Black-necked Stilt
scientific: Himantopus mexicanus
length: 36
colors: [schwarz, weiß, rot]
marks:
  - Nadelfeiner schwarzer Schnabel
  - Oberseite schwarz, Unterseite weiß, weißer Fleck über dem Auge
  - Extrem lange rosarote Beine
behavior: >-
  Stakst durchs flache Wasser und pickt Insekten von der Oberfläche. Warnt mit hartem,
  kläffendem „kek-kek-kek“ und fliegt Störenfriede an.
