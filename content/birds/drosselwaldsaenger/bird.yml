# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Drosselwaldsänger
english: Northern Waterthrush
scientific: Parkesia noveboracensis
length: 14
colors: [braun, weiß]
marks:
  - Langer, gelblich-weißer Überaugenstreif
  - Unterseite dicht dunkel gestrichelt
  - Wippt ständig mit dem Hinterkörper
behavior: >-
  Läuft am Boden an Ufern, Pfützen und unter Ufergebüsch entlang und wippt dabei
  unablässig. Ruft laut und metallisch „tschink“.
