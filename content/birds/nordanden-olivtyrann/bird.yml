# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Nordanden-Olivtyrann
english: Mountain Elaenia
scientific: Elaenia frantzii
length: 15
colors: [grün, gelb, grau]
marks:
  - Runder Kopf ohne Haube, schmaler heller Augenring
  - Zwei helle Flügelbinden
  - Oberseite oliv, Unterseite blass gelblich
behavior: >-
  Unauffällig, sitzt aufrecht an Waldrändern und frisst viele Beeren. Verrät sich durch
  ein gedehntes, abfallendes „piiiiu“.
