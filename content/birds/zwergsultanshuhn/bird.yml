# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Zwergsultanshuhn
english: Purple Gallinule
scientific: Porphyrio martinica
length: 33
colors: [blau, grün, rot, gelb]
marks:
  - Hellblaues Stirnschild, roter Schnabel mit gelber Spitze
  - Kopf und Unterseite violettblau, Rücken grün
  - Lange gelbe Beine und Zehen
  - Weiße Unterschwanzdecken
behavior: >-
  Klettert durch Schilf und läuft über Schwimmblätter, wippt dabei mit dem Schwanz.
  Frisst Samen, Blüten und Kleintiere.
