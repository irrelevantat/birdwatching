# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Amerika-Schlangenhalsvogel
english: Anhinga
scientific: Anhinga anhinga
length: 85
colors: [schwarz, weiß, braun]
marks:
  - Dolchspitzer, gerader Schnabel
  - Sehr langer, dünner Hals
  - Silberweiße Strichel auf Flügeln und Rücken
  - Langer, breiter Schwanz
behavior: >-
  Schwimmt so tief, dass nur Kopf und Hals aus dem Wasser ragen, und spießt Fische mit
  dem Schnabel auf. Trocknet danach lange mit gespreizten Flügeln und kreist gern hoch
  in der Thermik. Weibchen haben Kopf und Hals hellbraun.
