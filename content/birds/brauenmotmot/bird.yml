# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Brauenmotmot
english: Turquoise-browed Motmot
scientific: Eumomota superciliosa
length: 34
colors: [grün, blau, rotbraun, schwarz]
marks:
  - Türkisfarbener Überaugenstreif über schwarzer Maske
  - Schwarzer, türkis gesäumter Kehlfleck
  - Zwei lange Schwanzfedern mit kahlen Schäften und Spateln am Ende
behavior: >-
  Sitzt still auf Zäunen, Leitungen und offenen Ästen und pendelt mit dem Schwanz wie
  ein Uhrpendel. Gräbt seine Bruthöhle in Erdwände, daher der Name „Wächter der
  Schlucht“.
