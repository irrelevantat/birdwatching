# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Grünfischer
english: Green Kingfisher
scientific: Chloroceryle americana
length: 20
colors: [grün, weiß, rotbraun]
marks:
  - Weißer Halsring
  - Oberseite dunkel flaschengrün, Flügel weiß gefleckt
  - Männchen mit rostrotem Brustband, Weibchen mit zwei grünen Fleckenbändern
behavior: >-
  Sitzt niedrig auf Ästen und Wurzeln dicht über dem Wasser, wippt mit Kopf und Schwanz
  und stößt nach kleinen Fischen. Fliegt flach über die Wasserfläche und zeigt dabei
  weiße Schwanzseiten.
