# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Elfenwaldsänger
english: Tropical Parula
scientific: Setophaga pitiayumi
length: 11
colors: [blau, grau, gelb, orange]
marks:
  - Blaugraue Oberseite, Männchen mit schwarzer Maske
  - Gelbe Kehle, Brust orange überhaucht
  - Grünlicher Rückenfleck und zwei weiße Flügelbinden
behavior: >-
  Klein und flink in Baumkronen und an bemoosten Ästen. Der Gesang ist ein ansteigendes,
  summendes Trillern.
