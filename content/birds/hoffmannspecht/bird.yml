# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Hoffmannspecht
english: Hoffmann's Woodpecker
scientific: Melanerpes hoffmannii
length: 18-20
colors: [schwarz, weiß, grau, gelb, rot]
marks:
  - Roter Scheitelfleck (nur beim Männchen)
  - Gelber Nacken
  - Rücken und Flügel schwarz-weiß gebändert
behavior: >-
  Ein häufiger Specht der pazifischen Seite Mittelamerikas. Ruft ratternd, trommelt an
  Totholz und Palmen und frisst neben Insekten gern Früchte.
