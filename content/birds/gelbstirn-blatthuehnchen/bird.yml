# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Gelbstirn-Blatthühnchen
english: Northern Jacana
scientific: Jacana spinosa
size: 17–23 cm
marks:
  - Gelber Schnabel und gelber Stirnschild
  - Kastanienbrauner Körper, Kopf und Hals schwarz
  - Extrem lange Zehen zum Laufen auf Schwimmblättern
  - Gelbgrüne Schwungfedern, die beim Auffliegen aufleuchten
behavior: >-
  Läuft über Seerosen und Wasserpflanzen, als wäre es fester Boden. Die Rollen sind
  vertauscht: Das größere Weibchen verteidigt das Revier, die Männchen brüten und führen
  die Küken.
