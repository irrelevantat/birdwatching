# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Schopfkarakara
english: Crested Caracara
scientific: Caracara plancus
length: 50-60
colors: [schwarz, weiß, orange, gelb]
marks:
  - Schwarze Kappe mit kurzer Haube
  - Nacktes orangerotes Gesicht, heller Hakenschnabel
  - Lange gelbe Beine, läuft viel am Boden
  - Weißer Schwanz mit dunkler Endbinde
behavior: >-
  Ein Falke, der sich wie ein Geier benimmt: schreitet über Weiden und Strände und
  frisst Aas und alles, was er überwältigen kann. Im Flug fallen die hellen
  Flügelspitzen und der weiße Schwanz auf.
