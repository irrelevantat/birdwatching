# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Akazienzaunkönig
english: Banded Wren
scientific: Thryophilus pleurostictus
length: 14
colors: [rotbraun, weiß, schwarz]
marks:
  - Weißer Überaugenstreif, Wangen schwarz gestrichelt
  - Oberseite ungezeichnet rotbraun
  - Flanken kräftig schwarz gebändert
  - Schwanz schwarz quergebändert
behavior: >-
  Singt laut, klar und sehr abwechslungsreich mit Trillern und Pfiffen. Huscht durch
  Unterholz und Gestrüpp und zeigt sich meist nur kurz.
