# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Rotschnabeltaube
english: Red-billed Pigeon
scientific: Patagioenas flavirostris
length: 33
colors: [rotbraun, grau]
marks:
  - Heller Schnabel mit roter Basis, rotes Auge
  - Kopf, Hals und Brust weinrot
  - Rücken und Schwanz dunkel graublau
behavior: >-
  Hält sich meist hoch in den Baumkronen auf und frisst Früchte und Beeren. Der Ruf ist
  ein tiefes, rhythmisches „huuu, hup-hup-a-huu“.
