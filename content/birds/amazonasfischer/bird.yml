# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Amazonasfischer
english: Amazon Kingfisher
scientific: Chloroceryle amazona
length: 30
colors: [grün, weiß, rotbraun]
marks:
  - Langer, kräftiger schwarzer Schnabel und zottige Haube
  - Oberseite einfarbig dunkelgrün, Flügel fast ohne weiße Flecken
  - Männchen mit breitem rostrotem Brustband
behavior: >-
  Sitzt auf freien Ästen über dem Wasser, meist höher als der Grünfischer, und stößt
  kopfüber nach Fischen. Ruft hart „klek“.
