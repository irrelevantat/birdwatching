# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Fledermausfalke
english: Bat Falcon
scientific: Falco rufigularis
length: 23-30
colors: [schwarz, weiß, rotbraun]
marks:
  - Schwarzer Kopf, weiße Kehle und Halsseiten
  - Schwarze Brust, fein weiß quergebändert
  - Rostrote Hosen und Unterschwanzdecken
behavior: >-
  Sitzt auf hohen, kahlen Ästen und Masten und jagt in rasantem Flug Schwalben, Libellen
  und in der Dämmerung Fledermäuse.
