# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Blauringtaube
english: White-tipped Dove
scientific: Leptotila verreauxi
length: 28
colors: [braun, grau, weiß]
marks:
  - Blauer Augenring im hellen Gesicht
  - Ungezeichnete braune Oberseite, helle Unterseite
  - Weiße Schwanzecken, beim Auffliegen gut zu sehen
behavior: >-
  Läuft einzeln über den Waldboden und fliegt mit pfeifendem Flügelgeräusch auf. Der Ruf
  klingt wie das Blasen über einen Flaschenhals: ein tiefes, hohles „huu-huuuu“.
