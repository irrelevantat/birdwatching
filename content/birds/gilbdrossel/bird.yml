# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Gilbdrossel
english: Clay-colored Thrush
scientific: Turdus grayi
length: 24
colors: [braun]
marks:
  - Gelblich-grüner Schnabel
  - Einfarbig lehmbraun, unten etwas heller
  - Kehle fein dunkel gestrichelt
behavior: >-
  Sucht am Boden nach Würmern und Insekten und frisst Früchte. Der flötende,
  abwechslungsreiche Gesang erklingt vor allem zu Beginn der Regenzeit. Nationalvogel
  Costa Ricas.
