# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Goldwaldsänger
english: Yellow Warbler
scientific: Setophaga aestiva
length: 12
colors: [gelb, rotbraun]
marks:
  - Schlichtes gelbes Gesicht mit dunklem Knopfauge
  - Männchen mit rostroten Stricheln auf der Brust
  - Gelbe Felder im Schwanz
behavior: >-
  Turnt rastlos durch Büsche und Baumkronen und liest Insekten von den Blättern. Verrät
  sich durch ein hartes „tschip“ und verteidigt auch im Winterquartier ein kleines
  Revier.
