# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Moschusente
english: Muscovy Duck
scientific: Cairina moschata
length: 66-84
colors: [schwarz, weiß]
marks:
  - Schwarz mit grünem Glanz
  - Große weiße Flügelfelder, im Flug auffällig
  - Dunkles Gesicht mit Höcker am Schnabelgrund
behavior: >-
  Wildvögel sind scheu, ruhen auf Bäumen am Wasser und fliegen in der Dämmerung. Auf
  Höfen leben zahme Abkömmlinge mit roten Gesichtswarzen und viel Weiß.
