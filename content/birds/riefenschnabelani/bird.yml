# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Riefenschnabelani
english: Groove-billed Ani
scientific: Crotophaga sulcirostris
length: 32
colors: [schwarz]
marks:
  - Hoher, seitlich flacher Schnabel mit Längsrillen
  - Langer, locker getragener Schwanz
  - Ganz schwarz, wirkt oft zerzaust
behavior: >-
  Ein geselliger Kuckuck: lebt in Trupps, sonnt sich morgens mit gespreizten Flügeln und
  folgt Rindern, um aufgescheuchte Insekten zu fangen. Mehrere Weibchen legen ihre Eier
  in ein gemeinsames Nest.
