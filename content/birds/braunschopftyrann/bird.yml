# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Braunschopftyrann
english: Brown-crested Flycatcher
scientific: Myiarchus tyrannulus
length: 20
colors: [braun, grau, gelb, rotbraun]
marks:
  - Buschige braune Haube, kräftiger dunkler Schnabel
  - Graue Kehle und Brust, blassgelber Bauch
  - Rostrot in Flügeln und Schwanz
behavior: >-
  Sitzt aufrecht im mittleren Stockwerk, sträubt bei Erregung die Haube und ruft rollend
  „brrrt“ und scharf „huit“. Brütet in Baumhöhlen.
