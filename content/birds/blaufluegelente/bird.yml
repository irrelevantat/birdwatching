# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Blauflügelente
english: Blue-winged Teal
scientific: Spatula discors
length: 39
colors: [braun, blau, weiß]
marks:
  - Männchen mit weißem Halbmond vor dem Auge
  - Körper braun, dunkel getupft
  - Hellblaues Flügelfeld, im Flug gut zu sehen
behavior: >-
  Gründelt in kleinen Trupps im flachen Wasser nach Samen und Kleintieren und fliegt
  schnell und wendig auf. Weibchen sind braun geschuppt mit hellem Fleck am
  Schnabelgrund.
