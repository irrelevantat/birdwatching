# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Langschwanzhäher
english: White-throated Magpie-Jay
scientific: Calocitta formosa
length: 43-56
colors: [blau, weiß, schwarz]
marks:
  - Lange, nach vorn gebogene schwarze Haubenfedern
  - Weißes Gesicht, weiße Unterseite, schmales schwarzes Brustband
  - Sehr langer blauer Schwanz mit weißen Spitzen
behavior: >-
  Laut, neugierig und kaum zu übersehen. Zieht in kleinen Trupps durch Gärten und
  Trockenwald, schimpft rau und krächzend und inspiziert auch Frühstückstische.
