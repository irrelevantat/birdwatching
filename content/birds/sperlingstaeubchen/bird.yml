# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Sperlingstäubchen
english: Common Ground Dove
scientific: Columbina passerina
length: 16
colors: [grau, braun, rotbraun]
marks:
  - Schuppung nur an Kopf und Brust
  - Rosaroter Schnabel mit dunkler Spitze
  - Dunkle Flecken auf den Flügeln, kurzer Schwanz
behavior: >-
  Winzige Taube, die geduckt über offenen Boden trippelt und Samen aufliest. Fliegt mit
  rostrot aufleuchtenden Flügeln nur ein kurzes Stück weiter.
