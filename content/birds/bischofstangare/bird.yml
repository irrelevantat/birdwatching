# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Bischofstangare
english: Blue-gray Tanager
scientific: Thraupis episcopus
length: 16
colors: [blau, grau]
marks:
  - Kopf und Unterseite hell blaugrau
  - Flügel und Schwanz kräftig himmelblau
  - Dunkles Auge, kurzer kräftiger Schnabel
behavior: >-
  Paarweise oder in kleinen Trupps in Baumkronen, an Früchten und Futterstellen. Ruft
  hoch und zwitschernd und ist ständig in Bewegung.
