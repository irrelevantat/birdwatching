# Art-Steckbrief. Alle Felder sind in ANLEITUNG.md erklärt.

name: Weißflügeltaube
english: White-winged Dove
scientific: Zenaida asiatica
length: 29
colors: [braun, grau, weiß]
marks:
  - Breiter weißer Flügelrand
  - Blauer Augenring, schwarzer Strich an der Wange
  - Weiße Schwanzecken
behavior: >-
  Sitzt gern auf Leitungen und Baumkronen und sucht am Boden nach Samen und Früchten.
  Ruft eulenartig „hu-hu-hu-huu“.
