# Art-Steckbrief (Schmetterling). Alle Felder sind in ANLEITUNG.md erklärt.
# Quelle: Inhaltspaket „Schmetterlinge auf Ometepe“, Stand 2026-11-19.

name: Malachitfalter
english: Malachite
scientific: Siproeta stelenes
# Spannweite in cm (Spanne über alle Quellen)
wingspan: 7,1-10,2
colors: [grün, schwarz, braun]

# Bestimmungsmerkmale. Die Reihenfolge entspricht den Nummern in plate.svg.
marks:
  - Band aus durchscheinenden, gelbgrünen Flecken auf dem schwarzbraunen Vorderflügel.
  - Großes gelbgrünes Feld auf dem Hinterflügel.
  - Kurzes Schwänzchen am Hinterflügel.

behavior: >-
  Saugt vor allem an faulendem Obst, seltener an Vogelkot und Blüten. Männchen sitzen
  auf Sträuchern in Lichtungen und Obstgärten und fliegen von dort Patrouille. Abends
  schlafen mehrere Tiere zusammen unter niedrigen Blättern.
foodplants: >-
  Akanthusgewächse: Cafetín (Blechum brownei) und Ruellien (Ruellia coccinea).
lookalikes: >-
  Philaethria dido ist ähnlich grün-schwarz, hat aber eine andere Flügelform und keine
  Schwänzchen – für Ometepe ist die Art nicht belegt. Urania fulgens, ein tagaktiver
  Nachtfalter (2 Funde), ist ebenfalls schwarz-grün, trägt aber schmale, schillernde
  Bänder und lange Schwänze mit weißer Spitze.

