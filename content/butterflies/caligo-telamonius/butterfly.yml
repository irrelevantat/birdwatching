# Art-Steckbrief (Schmetterling). Alle Felder sind in ANLEITUNG.md erklärt.
# Quelle: Inhaltspaket „Schmetterlinge auf Ometepe“, Stand 2026-11-19.
# Hinweis: Merkmale 1 und 2 (Farben der Oberseite): eigene Kenntnis, nicht durch eine
# der genannten Quellen belegt. Die Quellen beschreiben nur Größe, Auge und Lebensweise.

name: Bananenfalter
english: Pale Owl-Butterfly
scientific: Caligo telamonius
# Spannweite in cm (Spanne über alle Quellen)
wingspan: 10-15
colors: [braun, grau, gelb]

# Bestimmungsmerkmale. Die Reihenfolge entspricht den Nummern in plate.svg.
marks:
  - "Oberseite: großes lehmgelbes bis hellbraunes Feld auf dem Vorderflügel."
  - "Oberseite: Hinterflügel dunkel, zur Basis hin blaugrau."
  - "Unterseite: ein großes, hell umrandetes „Eulenauge“ auf dem Hinterflügel."
  - Unterseite fein braun und grau marmoriert, wie Rinde.

behavior: >-
  Am aktivsten in der Morgen- und Abenddämmerung. Saugt den Saft faulender Früchte. Mit
  geschlossenen Flügeln zeigt er das große Auge der Unterseite – so siehst du ihn
  meistens.
foodplants: >-
  Banane (Musa), Helikonien (Heliconia) und Canna. In Bananenpflanzungen gelten die bis
  15 cm langen Raupen als Schädling.
lookalikes: >-
  Andere Caligo-Arten sind im GBIF-Auszug für Ometepe nicht belegt. Opsiphanes cassiae
  (4 Funde, alle bei El Madroñal) gehört zur selben Verwandtschaft; Unterschiede habe
  ich nicht geprüft. Mit geschlossenen Flügeln ähnelt auch Morpho helenor – er hat eine
  Reihe kleinerer Augen statt eines großen.

