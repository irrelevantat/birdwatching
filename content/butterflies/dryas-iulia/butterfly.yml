# Art-Steckbrief (Schmetterling). Alle Felder sind in ANLEITUNG.md erklärt.
# Quelle: Inhaltspaket „Schmetterlinge auf Ometepe“, Stand 2026-11-19.
# Hinweis: Der kurze schwarze Strich (Merkmal 4) und der Vergleich mit Marpesia petreus:
# eigene Kenntnis, nicht durch eine der genannten Quellen belegt.

name: Julia-Falter
english: Julia Heliconian
scientific: Dryas iulia
# Spannweite in cm
wingspan: 8,2-9,2
colors: [orange, schwarz]

# Bestimmungsmerkmale. Die Reihenfolge entspricht den Nummern in plate.svg.
marks:
  - Lange, schmale Vorderflügel.
  - "Männchen oben und unten einfarbig leuchtend orange; Weibchen matter."
  - Schmaler schwarzer Saum am Hinterflügel.
  - "Kurzer schwarzer Strich auf dem Vorderflügel; beim Weibchen mehr Schwarz."

behavior: >-
  Männchen patrouillieren den ganzen Tag. Die Falter fliegen täglich dieselbe Route von
  Blüte zu Blüte ab, gern an Lantana.
foodplants: Passionsblumen (Passiflora).
lookalikes: >-
  Dryadula phaetusa hat kräftige schwarze Streifen. Dione vanillae hat schwarze Flecken
  und Silber auf der Unterseite. Marpesia petreus (2 Funde) ist ebenfalls orange, trägt
  aber lange Schwänze – dieser Vergleich ist eigene Kenntnis, nicht durch eine der
  genannten Quellen belegt.

