# Art-Steckbrief (Schmetterling). Alle Felder sind in ANLEITUNG.md erklärt.
# Quelle: Inhaltspaket „Schmetterlinge auf Ometepe“, Stand 2026-11-19.
# Hinweis: Merkmale nur schwach belegt: Eine Blogquelle nennt weiße Flügel mit dünnen
# schwarzen Streifen, lange Schwänze und einen roten Streif auf der
# Hinterflügel-Unterseite. Die durchscheinenden Flügel (Merkmal 1) und der rote Fleck
# der Oberseite (Merkmal 4): eigene Kenntnis, nicht durch eine der genannten Quellen
# belegt.
# Hinweis: Lebensraumgruppe nach den Fundorten auf Ometepe gewählt; eine Quellenangabe
# zum Lebensraum fehlt.
# Hinweis: Spannweite: widersprüchliche Angaben, deshalb als Spanne.

name: Eurytides epidaus
english: Mexican Kite-Swallowtail
scientific: Eurytides epidaus
# Spannweite in cm (Spanne über alle Quellen)
wingspan: 4-6,8
size: "Spannweite 4–6,8 cm (Quellen uneins)"
colors: [weiß, schwarz, rot]

# Bestimmungsmerkmale. Die Reihenfolge entspricht den Nummern in plate.svg.
marks:
  - Weißliche, leicht durchscheinende Flügel.
  - Schmale schwarze Streifen, die vom Vorderrand in den Flügel laufen.
  - Sehr lange, dünne Schwänze.
  - Roter Fleck am Innenwinkel des Hinterflügels.

behavior: >-
  Zum Verhalten dieser Art habe ich keine belastbare Quelle gefunden. Die vier Funde auf
  Ometepe liegen alle zwischen April und Juni – das spricht für eine kurze Flugzeit zu
  Beginn der Regenzeit.
foodplants: >-
  Annonengewächse: Annona reticulata und Rollinia. In Costa Rica wurde die Art an Annona
  holosericea gezüchtet.
lookalikes: >-
  Im GBIF-Auszug ist für Ometepe kein zweiter Kite-Swallowtail belegt. Heliconius
  charithonia ist ebenfalls gestreift, aber schwarz mit gelben Streifen und ohne
  Schwänze.

