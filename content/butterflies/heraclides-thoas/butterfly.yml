# Art-Steckbrief (Schmetterling). Alle Felder sind in ANLEITUNG.md erklärt.
# Quelle: Inhaltspaket „Schmetterlinge auf Ometepe“, Stand 2026-11-19.
# Hinweis: Merkmal 2 (Randflecken), der gelbe Fleck im Schwanz (Merkmal 3) und Merkmal 4
# (roter Fleck): eigene Kenntnis, nicht durch eine der genannten Quellen belegt. Die
# Quelle beschreibt nur die Diagonalbinde.

name: Heraclides thoas
english: Thoas Swallowtail
scientific: Heraclides thoas
# Spannweite in cm (Spanne über alle Quellen)
wingspan: 10-13
colors: [schwarz, gelb]

# Bestimmungsmerkmale. Die Reihenfolge entspricht den Nummern in plate.svg.
marks:
  - >-
      Gelbe Diagonalbinde aus fast quadratischen Flecken, die in gerader Reihe über den
      schwarzen Vorderflügel läuft.
  - Reihe kleiner gelber Flecken vor dem Flügelrand.
  - Langer Schwanz mit gelbem Fleck in der Mitte.
  - Roter Fleck mit etwas Blau am Innenwinkel des Hinterflügels.

behavior: >-
  Besucht Blüten, etwa Lantana und Bougainvillea, und flattert beim Saugen mit den
  Vorderflügeln weiter. Männchen saugen in Gruppen von 4–6 Tieren an feuchtem Boden.
foodplants: >-
  Rautengewächse wie Zitrus (Citrus) und Zanthoxylum, dazu Pfeffergewächse (Piper). Die
  Raupe sieht aus wie Vogelkot und sitzt offen auf dem Blatt.
lookalikes: >-
  Heraclides rumiko (Western Giant Swallowtail; 1 Fund, Charco Verde) sieht fast gleich
  aus. Die Art wurde 2014 von H. cresphontes abgetrennt; trennen lässt sie sich meist
  nur am Foto – an den Nackenflecken, der Flügelform und Details des Musters. Fast alle
  großen gelb-schwarzen Schwalbenschwänze, die auf Ometepe gemeldet wurden, sind als H.
  thoas bestimmt.

