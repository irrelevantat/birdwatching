# Art-Steckbrief (Schmetterling). Alle Felder sind in ANLEITUNG.md erklärt.
# Quelle: Inhaltspaket „Schmetterlinge auf Ometepe“, Stand 2026-11-19.

name: Danaus eresimus
english: Soldier
scientific: Danaus eresimus
# Spannweite in cm
wingspan: 7-9,5
colors: [orange, braun, schwarz, weiß]

# Bestimmungsmerkmale. Die Reihenfolge entspricht den Nummern in plate.svg.
marks:
  - Braunorange, zur Flügelbasis dunkler, mit dünnen schwarzen Adern.
  - Schwarzer Flügelrand mit weißen Punkten.
  - Nur wenige weiße Flecken vor der Vorderflügelspitze.
  - "Männchen: schwarzer Duftschuppenfleck auf dem Hinterflügel."

behavior: >-
  Fliegt über offene Weiden und Felder und an den Rändern des Trockenwalds. Saugt Nektar
  an Blüten.
foodplants: Seidenpflanzen (Asclepias) und verwandte Schlingpflanzen.
lookalikes: >-
  Der Queen (Danaus gilippus; 1 Fund, San Ramón) ist sehr ähnlich, hat aber mehr weiße
  Flecken; ihm fehlt das Band heller, verwaschener Flecken auf der
  Hinterflügel-Unterseite. Der Monarch (Danaus plexippus) ist auf Ometepe nicht belegt:
  GBIF zeigt 0 Funde auf der Insel, 73 in ganz Nicaragua.

