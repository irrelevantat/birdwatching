# Art-Steckbrief (Schmetterling). Alle Felder sind in ANLEITUNG.md erklärt.
# Quelle: Inhaltspaket „Schmetterlinge auf Ometepe“, Stand 2026-11-19.
# Hinweis: Spannweite: Die Quellen widersprechen sich stark, deshalb als Spanne
# angegeben.

name: Blauer Morphofalter
english: Common Blue Morpho
scientific: Morpho helenor
# Spannweite in cm (Spanne über alle Quellen)
wingspan: 6,3-20,3
size: "Spannweite 6,3–20,3 cm (Quellen uneins)"
colors: [blau, schwarz, braun]

# Bestimmungsmerkmale. Die Reihenfolge entspricht den Nummern in plate.svg.
marks:
  - Oberseite leuchtend metallisch blau.
  - Breiter schwarzer Rand mit kleinen weißen Punkten.
  - Unterseite braun mit einer Reihe von Augenflecken.

behavior: >-
  Fliegt in hüpfendem Zickzack an Wegen, Waldrändern und Bächen entlang; das Blau blitzt
  auf und verschwindet wieder. Männchen patrouillieren morgens an Bachläufen; beim
  Landen klappt der Falter die Flügel zu. Saugt an gärendem Obst und Baumsaft, nicht an
  Blüten.
foodplants: >-
  Schmetterlingsblütler, zum Beispiel Machaerium, Lonchocarpus, Pterocarpus, Dalbergia,
  Mucuna und Erythrina.
lookalikes: >-
  Im GBIF-Auszug ist für Ometepe kein zweiter Morpho belegt. Mit geschlossenen Flügeln
  denkbar: der Bananenfalter (Caligo telamonius) – er hat ein einziges großes Auge statt
  einer Reihe.

