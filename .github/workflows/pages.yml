# Prüft und baut die Website bei jedem Pull Request und jedem Push auf main
# und veröffentlicht sie von main aus auf GitHub Pages.
# Einmalig nötig: Settings → Pages → Build and deployment → Source: „GitHub Actions“.
name: Website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Prüfen und bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      # Fotos vom letzten Lauf wiederverwenden: Fällt Wikimedia aus oder drosselt,
      # bleiben die bisherigen Fotos online. .photo-source sorgt dafür, dass ein
      # geändertes Foto in bird.yml neu geladen und das alte nicht mehr gezeigt wird.
      - name: Fotos aus dem Cache holen
        if: github.event_name != 'pull_request'
        uses: actions/cache@v5
        with:
          path: |
            content/birds/*/photo.*
            content/birds/*/.photo-source
          key: photos-${{ github.run_id }}
          restore-keys: photos-

      # Dateien aus dem Repository haben Vorrang vor dem Cache:
      # - Ordner gelöschter oder umbenannter Arten (nichts davon im Repository) entfernen
      # - liegt ein Foto im Repository, den Cache-Stand dieses Ordners verwerfen
      - name: Cache mit dem Repository abgleichen
        if: github.event_name != 'pull_request'
        run: |
          git checkout -- content/birds
          for d in content/birds/*/; do
            if [ -z "$(git ls-files -- "$d")" ]; then
              rm -rf -- "$d"
            elif [ -n "$(git ls-files -- "${d}photo.*")" ]; then
              git clean -fq -- "$d"
            fi
          done

      - name: Fehlende Fotos von Wikimedia Commons laden (Fehler brechen nicht ab)
        if: github.event_name != 'pull_request'
        run: npm run fotos
        continue-on-error: true
        timeout-minutes: 15
        env:
          PHOTO_USER_AGENT: vogelfuehrer-build/1.0 (static site build; GitHub Actions)

      - name: Pages konfigurieren
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Website bauen
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Website als Pages-Artefakt hochladen
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Veröffentlichen
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
