# Baut die Website bei jedem Push und veröffentlicht sie von main aus auf GitHub Pages.
# Einmalig nötig: Settings → Pages → Build and deployment → Source: „GitHub Actions“.
name: Website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Prüfen und bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Fotos von Wikimedia Commons laden (Fehler brechen nicht ab)
        run: npm run fotos
        continue-on-error: true
        env:
          PHOTO_USER_AGENT: vogelfuehrer-build/1.0 (static site build; GitHub Actions)

      - name: Pages konfigurieren
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Website bauen
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Website als Pages-Artefakt hochladen
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Veröffentlichen
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
